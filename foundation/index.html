tion by {vec 2,−1}","It slid 2 across"],"answer":1,"solution":"A full description names the move and gives the vector."}]},"learn":[{"type":"keybox","title":"Remember: vectors and translation","text":"{vec a,b}: top = across (+ right, − left). Bottom = up/down (+ up, − down).\nTo translate, move **every corner** by the vector.\nThe image is the same size and shape and faces the same way."},{"type":"keybox","title":"Remember: reflection","text":"x = a is vertical. y = b is horizontal. The y-axis is x = 0. The x-axis is y = 0.\nCount squares from each corner to the mirror. Go the same number past it.\nCorners on the mirror stay put. The image is flipped."},{"type":"keybox","title":"Remember: describe fully","text":"Same way round → 'Translation by the vector {vec a,b}'.\nFlipped → 'Reflection in the line x = … / y = …'.\nThe mirror line is halfway between matching corners."},{"type":"keybox","title":"Remember: this term","text":"**Ratio**: share using parts. **Inequalities**: solve like equations; flip the sign if you × or ÷ by a negative.\n**Graphs**: substitute x to get y. **Gradient** = rise ÷ run.\n**Pythagoras**: c² = a² + b². **Similar** shapes: multiply by the scale factor.\n**Sets**: ∩ = both, ∪ = either or both, A′ = not A."}],"tryit":[],"practice":[{"type":"plot","q":"Transformations: translate triangle P by {vec 5,2}. Click the 3 corners of P′.","grid":{"xmin":-6,"xmax":6,"ymin":-6,"ymax":6},"answer":[[1,1],[4,1],[1,4]],"given":{"polygons":[{"pts":[[-4,-1],[-1,-1],[-4,2]],"label":"P","style":"object"}]},"level":1,"skill":"transformations","hint":"5 right and 2 up.","solution":"P′: (1, 1), (4, 1), (1, 4)"},{"type":"plot","q":"Transformations: reflect triangle P in the line y = −1. Click the 3 corners of P′.","grid":{"xmin":-6,"xmax":6,"ymin":-6,"ymax":6},"answer":[[1,-3],[4,-3],[1,-5]],"given":{"polygons":[{"pts":[[1,1],[4,1],[1,3]],"label":"P","style":"object"}],"mirror":{"y":-1}},"level":2,"skill":"transformations","hint":"(1, 1) is 2 squares above y = −1.","solution":"(1, 1) → (1, −3). (4, 1) → (4, −3). (1, 3) → (1, −5)."},{"type":"mcq","level":2,"skill":"transformations","q":"Transformations: describe fully the move from P to P′.","diagram":{"kind":"grid","xmin":-6,"xmax":6,"ymin":-6,"ymax":6,"polygons":[{"pts":[[-4,1],[-1,1],[-1,4]],"label":"P","style":"object"},{"pts":[[-4,-1],[-1,-1],[-1,-4]],"label":"P′","style":"image"}]},"options":["Reflection in the y-axis","Reflection in the x-axis","Translation by {vec 0,−2}","Reflection in the line y = 1"],"answer":1,"solution":"P′ is flipped upside down. (−1, 4) ↔ (−1, −4): halfway is y = 0, the x-axis."},{"type":"num","level":1,"skill":"ratio","q":"Ratio: Keisha and Ravi share TT$60 in the ratio 2 : 3. How much does Ravi get?","answer":36,"unit":"TT$","hint":"Total parts = 2 + 3.","solution":"5 parts. 1 part = 60 ÷ 5 = TT$12. Ravi: 3 × 12 = TT$36."},{"type":"text","level":2,"skill":"inequalities","q":"Inequalities: solve 3x + 2 > 14.","accept":["x>4","4<x"],"hint":"Subtract 2 first. Then divide by 3.","solution":"3x > 12, so x > 4."},{"type":"num","level":1,"skill":"graphs","q":"Graphs: y = 2x − 3. Find y when x = 4.","answer":5,"solution":"y = 2 × 4 − 3 = 8 − 3 = 5"},{"type":"num","level":2,"skill":"gradient","q":"Gradient: find the gradient of the line through (1, 2) and (3, 8).","answer":3,"hint":"Gradient = rise ÷ run.","solution":"Rise = 8 − 2 = 6. Run = 3 − 1 = 2. 6 ÷ 2 = 3."},{"type":"num","level":2,"skill":"pythagoras","q":"Pythagoras: a right-angled triangle has shorter sides 6 cm and 8 cm. Find the hypotenuse.","answer":10,"unit":"cm","diagram":{"kind":"righttri","base":"8 cm","height":"6 cm","hyp":"c"},"solution":"c² = 6² + 8² = 36 + 64 = 100. c = √100 = 10 cm."},{"type":"mcq","level":1,"skill":"similarity","q":"Congruency: two triangles have all three sides the same length. Which test shows they are congruent?","options":["SSS","SAS","ASA","RHS"],"answer":0,"solution":"Three pairs of equal sides: SSS (side, side, side)."},{"type":"num","level":3,"skill":"similarity","q":"Similarity: two triangles are similar. A 4 cm side matches a 12 cm side. Another side on the small triangle is 5 cm. How long is the matching side on the big triangle?","answer":15,"unit":"cm","hint":"Scale factor = 12 ÷ 4.","solution":"Scale factor = 12 ÷ 4 = 3. 5 × 3 = 15 cm."},{"type":"venn","level":2,"skill":"sets","q":"Sets: shade A′.","sets":["A","B"],"answer":["B","O"],"solution":"Everything not in A: B only and the outside."},{"type":"num","level":3,"skill":"sets","q":"Sets: 25 students. 15 play cricket. 12 play football. 5 play both. How many play neither?","answer":3,"hint":"Cricket only = 15 − 5. Football only = 12 − 5.","solution":"10 + 5 + 7 = 22. Neither = 25 − 22 = 3."}],"exit":[{"type":"plot","q":"Reflect triangle P in the y-axis. Click the 3 corners of P′.","grid":{"xmin":-6,"xmax":6,"ymin":-6,"ymax":6},"answer":[[5,2],[3,2],[5,5]],"given":{"polygons":[{"pts":[[-5,2],[-3,2],[-5,5]],"label":"P","style":"object"}],"mirror":{"x":0}},"solution":"Only x changes sign. P′: (5, 2), (3, 2), (5, 5)"},{"type":"blanks","q":"Q moves to Q′ by a translation. Find the vector.","diagram":{"kind":"grid","xmin":-6,"xmax":6,"ymin":-6,"ymax":6,"polygons":[{"pts":[[-3,-1],[-1,-1],[-3,2]],"label":"Q","style":"object"},{"pts":[[1,-4],[3,-4],[1,-1]],"label":"Q′","style":"image"}]},"template":"Top number: [[4]]\nBottom number: [[-3]]","solution":"(−3, −1) → (1, −4): 4 right, 3 down. {vec 4,−3}"},{"type":"mcq","q":"Describe fully the move from R to R′.","diagram":{"kind":"grid","xmin":-6,"xmax":6,"ymin":-6,"ymax":6,"polygons":[{"pts":[[2,1],[5,1],[2,3]],"label":"R","style":"object"},{"pts":[[0,1],[-3,1],[0,3]],"label":"R′","style":"image"}]},"options":["Reflection in the y-axis","Reflection in the line x = 1","Translation by {vec −5,0}","Reflection in the x-axis"],"answer":1,"solution":"R′ is flipped left–right. (2, 1) ↔ (0, 1): halfway is x = 1."}],"teacherNote":"Use the practice score by topic (each item is tagged with its topic) to plan revision before the end-of-term summative. Transformations: check that students move every corner and give full descriptions. Across the term, the most common slips are: ratio parts in the wrong order, forgetting to flip the inequality sign, subtracting coordinates in the wrong order for gradient, and adding n(A) + n(B) without removing the overlap."}];</script><script>/* Diagram + markup helpers shared by screen and paper renderers.  Exposes window.WBD */
(function () {
  'use strict';
  var uid = 0;
  function nid(p) { uid += 1; return (p || 'id') + uid; }
  function esc(s) {

  }
  function fmtNum(n) { return String(n).replace(/^-/, '−'); }

  /* Inline markup: **bold**, {a/b} fractions, {vec a,b} column vectors, newlines. */
  function md(s) {
    var h = esc(s);
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\{vec\s*([^,{}]+),([^{}]+)\}/g, function (_, a, b) {
      return '<span class="vec" data-tok="' + esc('{vec ' + a.trim() + ',' + b.trim() + '}') + '"><span class="vb">(</span><span class="vc"><span>' + a.trim() + '</span><span>' + b.trim() + '</span></span><span class="vb">)</span></span>';
    });
    h = h.replace(/\{([^{}\s\/]+)\/([^{}\s\/]+)\}/g, function (_, a, b) {
      return '<span class="frac" data-tok="' + esc('{' + a + '/' + b + '}') + '"><span>' + a + '</span><span>' + b + '</span></span>';
    });
    h = h.replace(/\n/g, '<br>');
    return h;
  }

  /* ---------------- GRID ---------------- */
  function gridSVG(d, o) {
    o = o || {};
    var xmin = d.xmin, xmax = d.xmax, ymin = d.ymin, ymax = d.ymax;
    var spanX = xmax - xmin, spanY = ymax - ymin;
    var u = Math.min(o.maxUnit || 30, (o.maxW || 340) / spanX, (o.maxH || 340) / spanY);
    u = Math.max(u, 14);
    var pad = 26;
    var W = spanX * u + pad * 2, H = spanY * u + pad * 2;
    function X(x) { return pad + (x - xmin) * u; }
    function Y(y) { return pad + (ymax - y) * u; }
    var s = [];
    s.push('<svg class="dg grid" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="coordinate grid" data-u="' + u + '" data-pad="' + pad + '" data-xmin="' + xmin + '" data-ymax="' + ymax + '">');
    s.push('<rect class="g-bg" x="' + X(xmin) + '" y="' + Y(ymax) + '" width="' + spanX * u + '" height="' + spanY * u + '"/>');
    var x, y;
    for (x = Math.ceil(xmin); x <= xmax; x++) s.push('<line class="g-minor" x1="' + X(x) + '" y1="' + Y(ymin) + '" x2="' + X(x) + '" y2="' + Y(ymax) + '"/>');
    for (y = Math.ceil(ymin); y <= ymax; y++) s.push('<line class="g-minor" x1="' + X(xmin) + '" y1="' + Y(y) + '" x2="' + X(xmax) + '" y2="' + Y(y) + '"/>');
    var ax = (0 >= xmin && 0 <= xmax) ? 0 : xmin; // x position of y-axis
    var ay = (0 >= ymin && 0 <= ymax) ? 0 : ymin; // y position of x-axis
    s.push('<line class="g-axis" x1="' + X(xmin) + '" y1="' + Y(ay) + '" x2="' + (X(xmax) + 10) + '" y2="' + Y(ay) + '" marker-end="url(#ah)"/>');
    s.push('<line class="g-axis" x1="' + X(ax) + '" y1="' + Y(ymin) + '" x2="' + X(ax) + '" y2="' + (Y(ymax) - 10) + '" marker-end="url(#ah)"/>');
    s.push('<text class="g-axl" x="' + (X(xmax) + 12) + '" y="' + (Y(ay) + 14) + '">' + esc(d.xlabel || 'x') + '</text>');
    s.push('<text class="g-axl" x="' + (X(ax) + 6) + '" y="' + (Y(ymax) - 12) + '">' + esc(d.ylabel || 'y') + '</text>');
    var stepX = spanX > 14 ? 2 : 1, stepY = spanY > 14 ? 2 : 1;
    for (x = Math.ceil(xmin); x <= xmax; x++) {
      if (x === ax && ay === 0 && ax === 0) continue;
      if (x % stepX) continue;
      s.push('<text class="g-num" text-anchor="middle" x="' + X(x) + '" y="' + (Y(ay) + 13) + '">' + fmtNum(x) + '</text>');
    }
    for (y = Math.ceil(ymin); y <= ymax; y++) {
      if (y === ay && ax === 0 && ay === 0) continue;
      if (y % stepY) continue;
      s.push('<text class="g-num" text-anchor="end" x="' + (X(ax) - 4) + '" y="' + (Y(y) + 4) + '">' + fmtNum(y) + '</text>');
    }
    if (ax === 0 && ay === 0) s.push('<text class="g-num" text-anchor="end" x="' + (X(0) - 4) + '" y="' + (Y(0) + 13) + '">0</text>');
    s.push('<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g-ahead"/></marker>' +
      '<marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g-ahead2"/></marker></defs>');

    (d.polygons || []).forEach(function (p) {
      var pts = p.pts.map(function (q) { return X(q[0]) + ',' + Y(q[1]); }).join(' ');
      s.push('<polygon class="g-poly ' + esc(p.style || 'object') + '" points="' + pts + '"/>');
      if (p.label) {
        var cx = 0, cy = 0; p.pts.forEach(function (q) { cx += q[0]; cy += q[1]; });
        cx /= p.pts.length; cy /= p.pts.length;
        s.push('<text class="g-plab" text-anchor="middle" x="' + X(cx) + '" y="' + (Y(cy) + 5) + '">' + esc(p.label) + '</text>');
      }
    });
    if (d.mirror) {
      var mm = d.mirror, lab;
      if (mm.x !== undefined) { s.push('<line class="g-mirror" x1="' + X(mm.x) + '" y1="' + Y(ymin) + '" x2="' + X(mm.x) + '" y2="' + Y(ymax) + '"/>'); lab = 'x = ' + fmtNum(mm.x); s.push('<text class="g-mlab" x="' + (X(mm.x) + 4) + '" y="' + (Y(ymax) + 12) + '">' + lab + '</text>'); }
      else if (mm.y !== undefined) { s.push('<line class="g-mirror" x1="' + X(xmin) + '" y1="' + Y(mm.y) + '" x2="' + X(xmax) + '" y2="' + Y(mm.y) + '"/>'); lab = 'y = ' + fmtNum(mm.y); s.push('<text class="g-mlab" x="' + (X(xmin) + 4) + '" y="' + (Y(mm.y) - 5) + '">' + lab + '</text>'); }
      else if (mm.yx) { var lo = Math.max(xmin, ymin), hi = Math.min(xmax, ymax); s.push('<line class="g-mirror" x1="' + X(lo) + '" y1="' + Y(lo) + '" x2="' + X(hi) + '" y2="' + Y(hi) + '"/>'); s.push('<text class="g-mlab" x="' + (X(hi) - 30) + '" y="' + (Y(hi) + 4) + '">y = x</text>'); }
    }
    var legend = [];
    (d.lines || []).forEach(function (L) {
      var p1, p2;
      if (L.from && L.to) { p1 = L.from; p2 = L.to; }
      else if (L.x !== undefined && L.m === undefined) { p1 = [L.x, ymin]; p2 = [L.x, ymax]; }
      else {
        var m = L.m || 0, c = L.c || 0, pts = [];
        // intersect with box edges
        [xmin, xmax].forEach(function (xx) { var yy = m * xx + c; if (yy >= ymin - 1e-9 && yy <= ymax + 1e-9) pts.push([xx, yy]); });
        if (m !== 0) [ymin, ymax].forEach(function (yy) { var xx = (yy - c) / m; if (xx >= xmin - 1e-9 && xx <= xmax + 1e-9) pts.push([xx, yy]); });
        pts.sort(function (a, b) { return a[0] - b[0]; });
        if (pts.length < 2) return;
        p1 = pts[0]; p2 = pts[pts.length - 1];
      }
      s.push('<line class="g-line" x1="' + X(p1[0]) + '" y1="' + Y(p1[1]) + '" x2="' + X(p2[0]) + '" y2="' + Y(p2[1]) + '"/>');
      if (L.label && String(L.label).length <= 2) {
        var e = (Y(p1[1]) < Y(p2[1])) ? p1 : p2, lx = X(e[0]) + 6, ly = Y(e[1]) + 14;
        if (lx > W - 20) lx -= 18;
        s.push('<text class="g-llab" x="' + lx + '" y="' + ly + '">' + esc(L.label) + '</text>');
      } else if (L.label) legend.push(L.label);
    });
    (d.arrows || []).forEach(function (A) {
      s.push('<line class="g-arrow" x1="' + X(A.from[0]) + '" y1="' + Y(A.from[1]) + '" x2="' + X(A.to[0]) + '" y2="' + Y(A.to[1]) + '" marker-end="url(#ah2)"/>');
    });
    if (d.rise) {
      var a = d.rise.from, b = d.rise.to, run = b[0] - a[0], rise = b[1] - a[1];
      s.push('<path class="g-run" d="M' + X(a[0]) + ',' + Y(a[1]) + ' H' + X(b[0]) + '"/>');
      s.push('<path class="g-rise" d="M' + X(b[0]) + ',' + Y(a[1]) + ' V' + Y(b[1]) + '"/>');
      s.push('<text class="g-rlab run" text-anchor="middle" x="' + (X(a[0]) + X(b[0])) / 2 + '" y="' + (Y(a[1]) + (rise >= 0 ? 15 : -6)) + '">run = ' + fmtNum(Math.abs(run)) + '</text>');
      s.push('<text class="g-rlab rise" x="' + (X(b[0]) + 5) + '" y="' + (Y(a[1]) + Y(b[1])) / 2 + '">rise = ' + fmtNum(rise) + '</text>');
    }
    (d.points || []).forEach(function (P) {
      s.push('<circle class="g-pt" cx="' + X(P.x) + '" cy="' + Y(P.y) + '" r="4"/>');
      if (P.label) s.push('<text class="g-ptl" x="' + (X(P.x) + 6) + '" y="' + (Y(P.y) - 6) + '">' + esc(P.label) + '</text>');
    });
    s.push('<g class="g-user"></g>');
    if (legend.length) {
      legend.forEach(function (t, k) {
        var ly = H + 6 + k * 18;
        s.push('<line class="g-line" x1="' + pad + '" y1="' + (ly - 4) + '" x2="' + (pad + 22) + '" y2="' + (ly - 4) + '"/><text class="g-leg" x="' + (pad + 28) + '" y="' + ly + '">' + esc(t) + '</text>');
      });
      var H2 = H + legend.length * 18 + 4;
      s[0] = s[0].replace('0 0 ' + W + ' ' + H + '"', '0 0 ' + W + ' ' + H2 + '"').replace('height="' + H + '"', 'height="' + H2 + '"');
    }
    s.push('</svg>');
    return s.join('');
  }

  /* ---------------- RIGHT TRIANGLE ---------------- */
  function righttriSVG(d) {
    function num(v) { var m = String(v || '').match(/[\d.]+/); return m ? parseFloat(m[0]) : NaN; }
    var b = num(d.base), h = num(d.height), c = num(d.hyp);
    if (isNaN(b) && !isNaN(h) && !isNaN(c) && c > h) b = Math.sqrt(c * c - h * h);
    if (isNaN(h) && !isNaN(b) && !isNaN(c) && c > b) h = Math.sqrt(c * c - b * b);
    var r = (!isNaN(b) && !isNaN(h) && b > 0 && h > 0) ? h / b : 0.75;
    r = Math.min(Math.max(r, 0.35), 2.2);
    var BW = r > 1 ? 150 / r : 220, BH = BW * r;
    if (BH > 160) { BH = 160; BW = BH / r; }
    var px = 64, py = 22, W = BW + px * 2, H = BH + py * 2 + 18;
    var P0 = [px, py + BH], P1 = [px + BW, py + BH], P2 = [px, py];
    var s = ['<svg class="dg tri" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="right-angled triangle">'];
    s.push('<polygon class="t-fill" points="' + [P0, P1, P2].map(function (p) { return p.join(','); }).join(' ') + '"/>');
    s.push('<path class="t-ra" d="M' + P0[0] + ',' + (P0[1] - 13) + ' h13 v13"/>');
    s.push('<text class="t-lab" text-anchor="middle" x="' + (P0[0] + P1[0]) / 2 + '" y="' + (P0[1] + 18) + '">' + esc(d.base) + '</text>');
    s.push('<text class="t-lab" text-anchor="end" x="' + (P0[0] - 7) + '" y="' + (P0[1] + P2[1]) / 2 + '">' + esc(d.height) + '</text>');

  function renderItemPaper(day, sec, it, i) {
    var base = 'd' + day.day + '_' + sec.key + '_' + i;
    var wide = (it.diagram && it.diagram.kind === 'table' && (it.diagram.headers || []).length > 5) || ['blanks', 'self'].indexOf(it.type) > -1 || (it.type === 'mcq' && it.options.join('').length > 60) || String(it.q || '').length > 150;
    var h = '<div class="pitem t-' + it.type + (wide ? ' wide' : '') + '"><div class="pq"><span class="qno">' + itemNo(sec, i) + '</span>' + levelDots(it.level) + ' ';
    if (it.type !== 'blanks' || it.q) h += md(it.q || '');
    h += '</div>';
    if (it.diagram && !(it.type === 'venn' && it.diagram.kind === 'venn')) h += fig(base + '_diag', D.diagram(it.diagram, { maxW: 300, maxH: 260, maxUnit: 24 }));
    var work = sec.key === 'practice' && (it.level || 1) >= 2 ? 2 : (sec.key === 'exit' ? 1 : 0);
    switch (it.type) {
      case 'num': case 'text':
        if (work) h += '<div class="work"><span>Working</span>' + writeLines(work) + '</div>';
        h += '<div class="pans">Answer: <span class="box"></span>' + (it.unit ? ' ' + esc(it.unit) : '') + '</div>'; break;
      case 'mcq': h += '<div class="popts">' + it.options.map(function (o, k) { return '<span class="popt"><span class="ring">' + String.fromCharCode(65 + k) + '</span>' + md(o) + '</span>'; }).join('') + '</div><div class="tiny">Circle the correct letter.</div>'; break;
      case 'blanks':
        var parts = it.template.split(/\[\[(.+?)\]\]/);
        h += '<div class="ptpl">' + parts.map(function (p, k) { return k % 2 === 0 ? md(p) : '<span class="pblank" style="min-width:' + Math.max(2.4, p.split('|')[0].length * 0.75 + 1.4) + 'em"></span>'; }).join('') + '</div>'; break;
      case 'venn':
        var vd = (it.diagram && it.diagram.kind === 'venn') ? it.diagram : {};
        h += fig(base + '_ws', D.vennSVG({ sets: it.sets || vd.sets || ['A', 'B'], elements: vd.elements || {} }, [])) + '<div class="tiny">Shade the correct region.</div>'; break;
      case 'plot':
        var g = {}; Object.keys(it.given || {}).forEach(function (k) { g[k] = it.given[k]; });
        ['xmin', 'xmax', 'ymin', 'ymax'].forEach(function (k) { g[k] = it.grid[k]; });
        h += fig(base + '_ws', D.gridSVG(g, { maxW: 290, maxH: 290, maxUnit: 22 })); break;
      case 'numberline':
        h += fig(base + '_ws', D.numberlineSVG({ min: it.min, max: it.max }, null)); break;
      case 'self': h += writeLines(3); break;
    }
    if (it.hint && sec.key === 'tryit') h += '<div class="phint"><b>Hint:</b> ' + md(it.hint) + '</div>';
    return h + '</div>';
  }
  function renderLearnPaper(day, b, i) {
    var id = 'd' + day.day + '_learn_' + i;
    if (b.type === 'diagram') return '<figure class="pfigure">' + fig(id, D.diagram(b.diagram, { maxW: 300, maxH: 260, maxUnit: 24 })) + (b.caption ? '<figcaption>' + md(b.caption) + '</figcaption>' : '') + '</figure>';
    if (b.type === 'table') return fig(id, D.diagram({ kind: 'table', headers: b.headers, rows: b.rows }));
    if (b.type === 'example') {
      return '<div class="example"><div class="ex-t">' + md(b.title || 'Example') + '</div>' + (b.problem ? '<div class="ex-p">' + md(b.problem) + '</div>' : '') +
        '<div class="ex-body">' + (b.diagram ? fig(id, D.diagram(b.diagram, { maxW: 240, maxH: 220, maxUnit: 20 })) : '') +
        '<ol class="steps">' + b.steps.map(function (s) { return '<li>' + md(s) + '</li>'; }).join('') + '</ol></div>' +
        (b.answer ? '<div class="ex-a"><span>Answer</span> ' + md(b.answer) + '</div>' : '') + '</div>';
    }
    return learnBlock(b);
  }
  function paperDay(day) {
    var T = TOPIC[day.topic] || TOPIC.start;
    var h = '<article class="pday ' + T.c + '" id="pday' + day.day + '">';
    h += '<header class="phead"><div class="pday-no"><span>DAY</span>' + day.day + '</div><div class="ph-main"><div class="eyebrow">' + esc(T.name) + (day.syllabus ? ' · ' + esc(day.syllabus) : '') + (day.session ? ' · Session ' + day.session : '') + '</div><h2>' + esc(day.title) + '</h2><p class="ican"><b>Today:</b> ' + md(day.ican) + '</p></div>' +
      '<div class="ph-meta"><div>Name <span class="line"></span></div><div>Date <span class="line"></span></div></div></header>';
    if (day.vocab && day.vocab.length) h += '<div class="vocab"><div class="vt">Words to know</div><dl>' + day.vocab.map(function (v) { return '<div><dt>' + md(v.word) + '</dt><dd>' + md(v.meaning) + '</dd></div>'; }).join('') + '</dl></div>';
    SECTIONS.forEach(function (sec, si) {
      var list = sec.key === 'learn' ? (day.learn || []) : itemsOf(day, sec.key);
      if (!list.length) return;
      var title = sec.key === 'warmup' && day.warmup.skill ? sec.name + ': ' + day.warmup.skill : (day.checkpoint && sec.key === 'learn' ? 'Remember' : sec.name);
      h += '<section class="psec s-' + sec.key + '"><div class="sec-h"><span class="sec-n">' + (si + 1) + '</span><h3>' + md(title) + '</h3><span class="min">' + sec.min + ' min</span></div>';
      if (sec.key === 'learn') h += '<div class="plearn">' + list.map(function (b, i) { return renderLearnPaper(day, b, i); }).join('') + '</div>';
      else h += '<div class="pitems' + (sec.key !== 'tryit' ? ' cols2' : '') + '">' + list.map(function (it, i) { return renderItemPaper(day, sec, it, i); }).join('') + '</div>';
      h += '</section>';
    });
    h += '<section class="pfinish"><div class="pf-row"><div><b>How do I feel about today?</b> (circle one)<div class="pf-c"><span>I can do this</span><span>Nearly there</span><span>I need help</span></div></div>' +
      '<div class="pf-score"><b>Exit check</b><span class="box sm"></span> / ' + (day.exit || []).length + '</div></div>' +
      '<div><b>My question for my teacher:</b>' + writeLines(2) + '</div>' +
      '<div class="pf-teacher"><span>Teacher check</span><span class="tbox"></span><span class="tiny">Initials / comment</span></div></section>';
    return h + '</article>';
  }
  function frontMatter() {
    var h = '<section class="cover"><div class="cv-top">Third Form Mathematics · Class of 2029 · Term 1, 2026–27</div>' +
      '<h1>Foundation<br>Workbook</h1><p class="cv-sub">Daily practice that fixes the basics while you learn this term\'s work.</p>' +
      '<div class="cv-topics">' + topicOrder().map(function (g) { return '<span class="' + TOPIC[g.t].c + '">' + esc(TOPIC[g.t].name.replace(' + Review', '')) + '</span>'; }).join('') + '</div>' +
      '<div class="cv-name"><div>Name <span class="line"></span></div><div>Class <span class="line"></span></div><div>Teacher <span class="line"></span></div></div></section>';
    h += '<section class="fm"><h2>How to use this workbook</h2>' +
      '<p>This book has <b>' + DAYS.length + ' days</b>. Do <b>one day at a time</b>. Each day takes about 25 minutes.</p>' +
      '<ol class="fm-steps">' + SECTIONS.map(function (s, i) { return '<li><b>' + (i + 1) + '. ' + s.name + ' (' + s.min + ' min).</b> ' + s.blurb + '</li>'; }).join('') +
      '<li><b>6. Show your teacher.</b> Bring the page to class. Circle how you feel and write your question. Your teacher will help you.</li></ol>' +
      '<div class="keybox"><div class="kt">Tips for success</div><div>Write every step on its own line. Do not rush.<br>Mistakes are how you learn. Rub out, fix it, and keep going.<br>● questions are the start. ●● and ●●● are for when you are ready.<br>You can also do this workbook on a screen. The screen version checks your answers.</div></div>' +
      '<h2>My progress tracker</h2><table class="tracker"><thead><tr><th>Day</th><th>Title</th><th>Date</th><th>Exit</th><th>Feeling</th><th>Teacher</th></tr></thead><tbody>' +
      DAYS.map(function (d) { return '<tr><td>' + d.day + '</td><td>' + esc(d.title) + '</td><td></td><td>&nbsp;&nbsp;&nbsp;/' + (d.exit || []).length + '</td><td></td><td></td></tr>'; }).join('') + '</tbody></table></section>';
    return h;
  }
  function renderPaper(which) {
    document.body.classList.add('paper');
    var h = '';
    if (which === 'key') {
      h += '<section class="cover key"><div class="cv-top">Third Form Mathematics · Term 1, 2026–27</div><h1>Foundation Workbook<br><span>Teacher\'s Answer Key</span></h1><p class="cv-sub">Answers, short solutions and the misconception to watch for on each day.</p></section>';
      h += '<section class="fm"><h2>Day map</h2><table class="tracker"><thead><tr><th>Day</th><th>Session</th><th>Topic</th><th>Title</th><th>Today</th></tr></thead><tbody>' +
        DAYS.map(function (d) { return '<tr><td>' + d.day + '</td><td>' + (d.session || '') + '</td><td>' + esc((TOPIC[d.topic] || {}).name) + '</td><td>' + esc(d.title) + '</td><td>' + md(d.ican) + '</td></tr>'; }).join('') + '</tbody></table></section>';
      DAYS.forEach(function (d) {
        h += '<article class="kday"><h3><span>Day ' + d.day + '</span> ' + esc(d.title) + '</h3><div class="tnote"><b>Watch for:</b> ' + md(d.teacherNote) + '</div>';
        SECTIONS.forEach(function (sec) {
          if (sec.key === 'learn') return;
          var list = itemsOf(d, sec.key); if (!list.length) return;
          h += '<div class="ksec"><h4>' + sec.name + '</h4><ol class="klist">' + list.map(function (it, i) {
            return '<li><span class="qno">' + itemNo(sec, i) + '</span><span class="ka">' + md(C.answerText(it)) + '</span>' + (it.solution && it.type !== 'self' ? '<span class="ks">' + md(it.solution) + '</span>' : '') + '</li>';
          }).join('') + '</ol></div>';
        });
        h += '</article>';
      });
    } else {
      h += frontMatter();
      DAYS.forEach(function (d) { h += paperDay(d); });
    }
    app.innerHTML = h;
    // inline token gallery for DOCX builder
    var toks = {};
    app.querySelectorAll('[data-tok]').forEach(function (el) { toks[el.dataset.tok] = el.outerHTML; });
    var gal = document.createElement('div'); gal.id = 'tokgal';
    gal.innerHTML = Object.keys(toks).map(function (k, i) { return '<span class="tokimg" data-tokkey="' + esc(k) + '">' + toks[k] + '</span>'; }).join(' ');
    document.body.appendChild(gal);
    window.WB_READY = true;
  }

  /* print a single day from the screen app */
  function canPrint() { try { return window.self === window.top; } catch (e) { return false; } }
  function printDay(day) {
    var pa = document.getElementById('printarea');
    pa.innerHTML = paperDay(day);
    document.body.classList.add('printing-day');
    setTimeout(function () { window.print(); }, 50);
  }
  window.addEventListener('afterprint', function () { document.body.classList.remove('printing-day'); });

  /* ================= ROUTER ================= */
  function route() {
    var hsh = (location.hash || '').replace('#', '');
    if (/^day\d+$/.test(hsh)) renderDay(+hsh.slice(3));
    else if (hsh === 'teacher') renderTeacher();
    else renderHome();
  }
  function init() {
    app = document.getElementById('app');
    if (MODE === 'student' || MODE === 'key') { renderPaper(MODE); return; }
    try { var th = localStorage.getItem('f3wb-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (x) { /* ignore */ }
    window.addEventListener('scroll', function () { var tb = document.querySelector('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
    app.addEventListener('click', onClick);
    app.addEventListener('input', onInput);
    app.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', route);
    window.addEventListener('online', flush);
    setTimeout(flush, 1500);
    route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body></html>
