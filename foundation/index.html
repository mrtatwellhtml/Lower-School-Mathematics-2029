ht.","level":1,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-1,"c":2,"label":"A"},{"m":0,"c":-2,"label":"B"},{"m":1,"c":-1,"label":"C"}]}},{"type":"num","q":"Find the gradient of the line through (0, 6) and (2, 0).","answer":-3,"solution":"Run = 2. Rise = −6 (down 6). m = −6 ÷ 2 = −3.","level":2,"diagram":{"kind":"grid","xmin":-1,"xmax":6,"ymin":-1,"ymax":7,"lines":[{"m":-3,"c":6,"label":"y = −3x + 6"}],"points":[{"x":0,"y":6},{"x":2,"y":0}],"rise":{"from":[0,6],"to":[2,0]}}},{"type":"num","q":"Find the gradient of the line through (−2, 4) and (2, 2). (You may type a fraction, like 1/2, or a decimal.)","answer":-0.5,"solution":"Run = 4. Rise = −2. m = {−2/4} = −0.5.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-0.5,"c":3,"label":"y = −{1/2}x + 3"}],"points":[{"x":-2,"y":4},{"x":2,"y":2}],"rise":{"from":[-2,4],"to":[2,2]}},"tol":0.01},{"type":"mcq","q":"Aaliyah says the gradient of this line is 2. What mistake did she make?","options":["She forgot the minus sign. m = −2","No mistake. m = 2","The line is flat, so m = 0"],"answer":0,"solution":"The line goes downhill, so the gradient must be negative. Run 1, rise −2: m = −2.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-2,"c":1,"label":"y = −2x + 1"}],"rise":{"from":[0,1],"to":[1,-1]}}},{"type":"num","q":"The water in a tank goes from 8 buckets to 2 buckets in 3 days. The graph shows buckets (y) after x days. Find the gradient.","answer":-2,"solution":"Run = 3. Rise = −6 (down 6). m = −6 ÷ 3 = −2.","level":3,"diagram":{"kind":"grid","xmin":0,"xmax":8,"ymin":0,"ymax":8,"lines":[{"from":[0,8],"to":[3,2],"label":"buckets left"}],"rise":{"from":[0,8],"to":[3,2]}}},{"type":"mcq","q":"In that tank question, m = −2. What does the minus sign tell you?","options":["The water goes down by 2 buckets each day","The water goes up by 2 buckets each day","There are 2 buckets left"],"answer":0,"solution":"Negative gradient = going down. 2 = how much each day.","level":3}],"exit":[{"type":"mcq","q":"A line goes downhill from left to right. Its gradient is…","options":["positive","negative","zero"],"answer":1,"solution":"Downhill means negative."},{"type":"num","q":"Find the gradient of the line through (0, 5) and (5, 0).","answer":-1,"solution":"Run = 5. Rise = −5. m = −5 ÷ 5 = −1.","diagram":{"kind":"grid","xmin":-1,"xmax":6,"ymin":-1,"ymax":6,"lines":[{"m":-1,"c":5,"label":"y = −x + 5"}],"points":[{"x":0,"y":5},{"x":5,"y":0}]}}],"teacherNote":"Students often read lines right to left, or give the size of the gradient but forget the minus sign. Others think a flat line has “no gradient” instead of 0. Fix: make them trace the line with a finger from left to right and say “uphill, downhill or flat?” before counting. Ask: “You went down — so is your rise + or −?”"},{"day":22,"topic":"gradient","session":5,"syllabus":"3.2.2","title":"Gradient from two points","ican":"I can find the gradient between two points using m = (y₂ − y₁) ÷ (x₂ − x₁).","checkpoint":false,"vocab":[{"word":"change in y","meaning":"how much y goes up or down: y₂ − y₁ (this is the rise)"},{"word":"change in x","meaning":"how much x goes across: x₂ − x₁ (this is the run)"}],"warmup":{"skill":"Subtracting negatives","items":[{"type":"num","q":"5 − (−2) = ?","answer":7,"solution":"Taking away a negative is adding: 5 + 2 = 7."},{"type":"num","q":"−3 − 4 = ?","answer":-7,"solution":"Start at −3 and go 4 more to the left: −7."},{"type":"num","q":"−1 − (−6) = ?","answer":5,"solution":"−1 + 6 = 5."},{"type":"num","q":"2 − 7 = ?","answer":-5,"solution":"Start at 2 and go 7 to the left: −5."},{"type":"mcq","q":"Yesterday: what is the sign of the gradient of this line?","options":["Positive","Negative","Zero"],"answer":1,"solution":"The line goes downhill from left to right, so the gradient is negative.","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-1,"c":1}]}}]},"learn":[{"type":"p","text":"Counting squares works when you have a grid. But what if you only know two points, like A(1, 1) and B(3, 7)? Use subtraction instead. The rise is the change in y. The run is the change in x."},{"type":"keybox","title":"Key idea","text":"For points A(x₁, y₁) and B(x₂, y₂): m = {change in y/change in x} = (y₂ − y₁) ÷ (x₂ − x₁). Take the points in the **same order** on top and bottom. y goes on top."},{"type":"example","title":"Example 1: Two positive points","problem":"Find the gradient of the line through A(1, 1) and B(3, 7).","steps":["x₁ = 1, y₁ = 1, x₂ = 3, y₂ = 7","Change in y: 7 − 1 = 6","Change in x: 3 − 1 = 2","m = 6 ÷ 2","m = 3","Check on the grid: run 2, rise 6. ✓"],"answer":"m = 3","diagram":{"kind":"grid","xmin":0,"xmax":8,"ymin":0,"ymax":8,"lines":[{"m":3,"c":-2,"label":"y = 3x − 2"}],"points":[{"x":1,"y":1,"label":"A"},{"x":3,"y":7,"label":"B"}],"rise":{"from":[1,1],"to":[3,7]}}},{"type":"example","title":"Example 2: With negatives","problem":"Find the gradient of the line through P(−2, 5) and Q(2, −3).","steps":["x₁ = −2, y₁ = 5, x₂ = 2, y₂ = −3","Change in y: −3 − 5 = −8","Change in x: 2 − (−2) = 2 + 2 = 4","m = −8 ÷ 4","m = −2","Check: the line goes downhill, so negative is right. ✓"],"answer":"m = −2","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":6,"lines":[{"m":-2,"c":1,"label":"y = −2x + 1"}],"points":[{"x":-2,"y":5,"label":"P"},{"x":2,"y":-3,"label":"Q"}],"rise":{"from":[-2,5],"to":[2,-3]}}},{"type":"tip","text":"Write x₁, y₁, x₂, y₂ above the numbers first. Use brackets when you take away a negative: 2 − (−2)."}],"tryit":[{"type":"blanks","q":"Find the gradient of the line through A(2, 3) and B(5, 9).","template":"Change in y: 9 − 3 = [[6]]. Change in x: 5 − 2 = [[3]]. m = 6 ÷ 3 = [[2]].","solution":"m = {6/3} = 2","hint":"y on top: 9 − 3."},{"type":"blanks","q":"Find the gradient of the line through C(−1, 4) and D(3, −4).","template":"Change in y: −4 − 4 = [[−8]]. Change in x: 3 − (−1) = [[4]]. m = −8 ÷ 4 = [[−2]].","solution":"m = {−8/4} = −2","hint":"3 − (−1) = 3 + 1."},{"type":"blanks","q":"Find the gradient of the line through E(0, 1) and F(4, 3).","template":"Change in y: 3 − 1 = [[2]]. Change in x: 4 − 0 = [[4]]. m = {2/4} = [[1/2|0.5]].","solution":"m = {2/4} = {1/2}","hint":"Simplify {2/4}."}],"practice":[{"type":"num","q":"Find the gradient of the line through (1, 2) and (3, 8).","answer":3,"solution":"(8 − 2) ÷ (3 − 1) = 6 ÷ 2 = 3.","level":1},{"type":"num","q":"Find the gradient of the line through (2, 5) and (6, 5).","answer":0,"solution":"(5 − 5) ÷ (6 − 2) = 0 ÷ 4 = 0. A flat line.","level":1},{"type":"num","q":"Find the gradient of the line through (−1, 3) and (1, −1).","answer":-2,"solution":"(−1 − 3) ÷ (1 − (−1)) = −4 ÷ 2 = −2.","level":2},{"type":"num","q":"Find the gradient of the line through (−3, −2) and (1, 6).","answer":2,"solution":"(6 − (−2)) ÷ (1 − (−3)) = 8 ÷ 4 = 2.","level":2},{"type":"num","q":"Find the gradient of the line through (0, 4) and (6, 1). (You may type a fraction, like 1/2, or a decimal.)","answer":-0.5,"solution":"(1 − 4) ÷ (6 − 0) = −3 ÷ 6 = −{1/2} = −0.5.","level":2,"tol":0.01},{"type":"mcq","q":"For A(1, 2) and B(3, 8), Jaden writes m = (3 − 1) ÷ (8 − 2) = {2/6}. What went wrong?","options":["He put the x change on top. m = 6 ÷ 2 = 3","Nothing. m = {2/6}","He should add: m = {10/4}"],"answer":0,"solution":"y goes on top: (8 − 2) ÷ (3 − 1) = 6 ÷ 2 = 3.","level":2},{"type":"num","q":"A maxi-taxi fare is TT$7 for 2 km and TT$15 for 6 km. Points (2, 7) and (6, 15). Find the gradient.","answer":2,"solution":"(15 − 7) ÷ (6 − 2) = 8 ÷ 4 = 2. The fare goes up TT$2 for each km.","level":3,"unit":"TT$ per km"},{"type":"mcq","q":"Do A(0, 1), B(2, 5) and C(4, 9) lie on one straight line?","options":["Yes — AB and BC both have gradient 2","No — the gradients are different"],"answer":0,"solution":"AB: (5 − 1) ÷ (2 − 0) = 2. BC: (9 − 5) ÷ (4 − 2) = 2. Same gradient, so one straight line.","level":3}],"exit":[{"type":"num","q":"Find the gradient of the line through (1, 3) and (4, 9).","answer":2,"solution":"(9 − 3) ÷ (4 − 1) = 6 ÷ 3 = 2."},{"type":"num","q":"Find the gradient of the line through (−2, 1) and (2, −7).","answer":-2,"solution":"(−7 − 1) ÷ (2 − (−2)) = −8 ÷ 4 = −2."}],"teacherNote":"Common errors: x-change on top; mixing the order (y₂ − y₁ on top but x₁ − x₂ on bottom), which flips the sign; and 2 − (−2) = 0. Fix: label x₁, y₁, x₂, y₂ above the numbers, and check the sign with a quick sketch (uphill = +, downhill = −). Ask: “Does your sign match your sketch?”"},{"day":23,"topic":"gradient","session":6,"syllabus":"3.2.2","title":"Where it crosses: the y-intercept","ican":"I can find the y-intercept and read m and c from y = mx + c.","checkpoint":false,"vocab":[{"word":"y-intercept","meaning":"where the line crosses the y-axis; there, x = 0"},{"word":"m","meaning":"the gradient: the number in front of x"},{"word":"c","meaning":"the y-intercept: the number on its own"}],"warmup":{"skill":"Substitution with x = 0","items":[{"type":"num","q":"y = 3x + 5. Find y when x = 0.","answer":5,"solution":"3 × 0 = 0. 0 + 5 = 5."},{"type":"num","q":"y = −2x + 7. Find y when x = 0.","answer":7,"solution":"−2 × 0 = 0. 0 + 7 = 7."},{"type":"num","q":"y = 4x − 1. Find y when x = 0.","answer":-1,"solution":"4 × 0 = 0. 0 − 1 = −1."},{"type":"num","q":"y = 6 − x. Find y when x = 0.","answer":6,"solution":"6 − 0 = 6."},{"type":"num","q":"Yesterday: find the gradient of the line through (2, 1) and (4, 7).","answer":3,"solution":"(7 − 1) ÷ (4 − 2) = 6 ÷ 2 = 3."}]},"learn":[{"type":"p","text":"Marcus joins a phone plan. It costs TT$20 to join, then TT$10 a week. At week 0 he has already paid TT$20. So his cost graph starts at 20 on the y-axis. That starting point is the **y-intercept**."},{"type":"p","text":"Look at the warm-up: when x = 0, y was always the number on its own. That number is where the line crosses the y-axis."},{"type":"keybox","title":"Key idea","text":"In y = mx + c: **m** is the gradient (the number in front of x). **c** is the y-intercept (the number on its own). The line crosses the y-axis at (0, c)."},{"type":"diagram","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":2,"c":1,"label":"y = 2x + 1"}],"points":[{"x":0,"y":1,"label":"y-intercept (0, 1)"}]},"caption":"y = 2x + 1: gradient m = 2, y-intercept c = 1."},{"type":"example","title":"Example 1: Read m and c","problem":"Find the gradient and y-intercept of y = 3x − 2.","steps":["Compare with y = mx + c.","The number in front of x is 3. So m = 3.","The number on its own is −2. Keep the sign! So c = −2.","The line crosses the y-axis at (0, −2)."],"answer":"m = 3, c = −2"},{"type":"example","title":"Example 2: Put it in order first","problem":"Find m and c for y = 5 − 2x.","steps":["Swap the order: y = −2x + 5.","The number in front of x is −2. So m = −2.","The number on its own is 5. So c = 5."],"answer":"m = −2, c = 5"},{"type":"example","title":"Example 3: Read m and c from a graph","problem":"Find m and c for the line on the grid.","steps":["The line crosses the y-axis at −3. So c = −3.","Start at (0, −3). Go right 1: run = 1.","Go up 2 to meet the line again: rise = 2.","m = 2 ÷ 1 = 2."],"answer":"m = 2, c = −3","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":2,"c":-3}],"points":[{"x":0,"y":-3}],"rise":{"from":[0,-3],"to":[1,-1]}}},{"type":"tip","text":"y = x + 4 has m = 1 (x means 1x). y = 3x has c = 0, so it passes through the origin."}],"tryit":[{"type":"blanks","q":"Look at y = 4x + 7.","template":"m = [[4]]. c = [[7]].","solution":"The number in front of x is 4. The number on its own is 7.","hint":"m is stuck to the x. c is on its own."},{"type":"blanks","q":"Look at y = −x + 2.","template":"m = [[−1]]. c = [[2]]. The line crosses the y-axis at (0, [[2]]).","solution":"−x means −1x. So m = −1 and c = 2.","hint":"−x is the same as −1 × x."},{"type":"blanks","q":"Read m and c from the graph.","template":"The line crosses the y-axis at y = [[1]], so c = [[1]]. Run = 1, rise = [[3]], so m = [[3]].","solution":"c = 1, m = 3","hint":"c: where does the line cut the up-and-down axis?","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":3,"c":1}],"rise":{"from":[0,1],"to":[1,4]}}}],"practice":[{"type":"num","q":"What is the y-intercept of y = 2x − 6?","answer":-6,"solution":"The number on its own is −6.","level":1},{"type":"plot","q":"Plot the point where y = x + 4 crosses the y-axis.","grid":{"xmin":-5,"xmax":5,"ymin":-5,"ymax":5},"answer":[[0,4]],"solution":"c = 4, so the line crosses at (0, 4).","hint":"On the y-axis, x = 0.","level":1},{"type":"mcq","q":"For y = 7 − 3x, what are m and c?","options":["m = 7, c = −3","m = −3, c = 7","m = 3, c = 7"],"answer":1,"solution":"Rewrite: y = −3x + 7. So m = −3 and c = 7.","level":2},{"type":"num","q":"What is the gradient of y = x − 5?","answer":1,"solution":"x means 1x. So m = 1.","level":2},{"type":"num","q":"Read the y-intercept c from the graph.","answer":3,"solution":"The line crosses the y-axis at 3. So c = 3.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-2,"c":3}]}},{"type":"num","q":"Read the gradient m from the same graph.","answer":-2,"solution":"From (0, 3) go right 1 and down 2. Rise −2, run 1. m = −2.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-2,"c":3}],"rise":{"from":[0,3],"to":[1,1]}}},{"type":"plot","q":"Plot the y-intercepts of y = 2x − 1 and y = −x + 5.","grid":{"xmin":-5,"xmax":5,"ymin":-5,"ymax":6},"answer":[[0,-1],[0,5]],"solution":"c = −1 gives (0, −1). c = 5 gives (0, 5).","level":3},{"type":"num","q":"Kyle's phone plan: y = 15x + 30, where x is weeks and y is the total cost in TT$. What is the joining fee?","answer":30,"solution":"The joining fee is the cost at week 0: c = 30. TT$30.","hint":"At the start, x = 0.","level":3,"unit":"TT$"}],"exit":[{"type":"num","q":"What is the gradient of y = 3x − 5?","answer":3,"solution":"The number in front of x is 3."},{"type":"plot","q":"Plot the point where y = 2x − 3 crosses the y-axis.","grid":{"xmin":-5,"xmax":5,"ymin":-5,"ymax":5},"answer":[[0,-3]],"solution":"c = −3, so (0, −3)."}],"teacherNote":"Watch for students dropping the sign of c (y = 3x − 2 → c = 2), for thinking m is the first number written (y = 5 − 2x → m = 5), and for y = x + 4 → m = 0. Also some mark the intercept on the x-axis. Fix: “m is glued to x; c is on its own; the y-intercept is on the y-axis.” Ask: “What is y when x = 0?”"},{"day":24,"topic":"gradient","session":6,"syllabus":"3.2.2","title":"Writing the equation","ican":"I can write the equation y = mx + c from m and c, from a graph, or from two points.","checkpoint":false,"vocab":[{"word":"equation of a line","meaning":"a rule y = mx + c that every point on the line obeys"},{"word":"check","meaning":"put a point into your equation to see if it works"}],"warmup":{"skill":"Solving simple equations","items":[{"type":"num","q":"x + 4 = 9. Find x.","answer":5,"solution":"x = 9 − 4 = 5."},{"type":"num","q":"3x = 12. Find x.","answer":4,"solution":"x = 12 ÷ 3 = 4."},{"type":"num","q":"2x + 1 = 7. Find x.","answer":3,"solution":"2x = 7 − 1 = 6. x = 6 ÷ 2 = 3."},{"type":"num","q":"5 = 2 + c. Find c.","answer":3,"solution":"c = 5 − 2 = 3."},{"type":"num","q":"Yesterday: what is the y-intercept of y = 4x − 7?","answer":-7,"solution":"The number on its own is −7."}]},"learn":[{"type":"p","text":"Every straight line has its own name: its **equation**. To write it, you only need two numbers: m and c."},{"type":"keybox","title":"Key idea","text":"To write the equation: 1) Find m (the gradient). 2) Find c (the y-intercept). 3) Put them into y = mx + c. 4) Check with a point on the line."},{"type":"example","title":"Example 1: From m and c","problem":"Write the equation of the line with gradient 3 and y-intercept −1.","steps":["Start with y = mx + c.","Put m = 3: y = 3x + c","Put c = −1: y = 3x + (−1)","Tidy up: y = 3x − 1"],"answer":"y = 3x − 1"},{"type":"example","title":"Example 2: From a graph","problem":"Write the equation of the line on the grid.","steps":["The line crosses the y-axis at 4. So c = 4.","From (0, 4) go right 2 to (2, 0): run = 2.","You went down 4: rise = −4.","m = −4 ÷ 2 = −2","y = −2x + 4","Check (2, 0): −2 × 2 + 4 = −4 + 4 = 0 ✓"],"answer":"y = −2x + 4","diagram":{"kind":"grid","xmin":-2,"xmax":6,"ymin":-2,"ymax":6,"lines":[{"m":-2,"c":4}],"points":[{"x":0,"y":4},{"x":2,"y":0}],"rise":{"from":[0,4],"to":[2,0]}}},{"type":"example","title":"Example 3: From two points","problem":"Write the equation of the line through A(1, 5) and B(3, 9).","steps":["m = (9 − 5) ÷ (3 − 1) = 4 ÷ 2 = 2","So y = 2x + c.","Put in A(1, 5): 5 = 2 × 1 + c","5 = 2 + c","c = 3","y = 2x + 3","Check B(3, 9): 2 × 3 + 3 = 9 ✓"],"answer":"y = 2x + 3"},{"type":"tip","text":"If m = 1, write y = x + c (not 1x). If c = 0, write y = mx. If c is negative, use a minus: y = 2x − 5."}],"tryit":[{"type":"blanks","q":"Write the equation of the line with m = 4 and c = 2.","template":"y = [[4]]x + [[2]]","solution":"y = 4x + 2","hint":"m goes in front of x. c goes on the end."},{"type":"blanks","q":"Write the equation of the line on the grid.","template":"c = [[−2]]. Run 1, rise [[3]], so m = [[3]]. The equation is y = [[3]]x − [[2]].","solution":"y = 3x − 2","hint":"Where does the line cut the y-axis?","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":3,"c":-2}],"rise":{"from":[0,-2],"to":[1,1]}}},{"type":"blanks","q":"Write the equation of the line through (0, 1) and (2, 7).","template":"m = (7 − 1) ÷ (2 − 0) = [[3]]. (0, 1) is on the y-axis, so c = [[1]]. y = [[3]]x + [[1]].","solution":"y = 3x + 1","hint":"A point with x = 0 gives you c straight away."}],"practice":[{"type":"text","q":"Write the equation of the line with m = 2 and c = 5.","accept":["y=2x+5","y=5+2x"],"solution":"y = 2x + 5","hint":"Type it like y=2x+5","level":1},{"type":"text","q":"Write the equation of the line with m = −3 and c = 1.","accept":["y=-3x+1","y=1-3x"],"solution":"y = −3x + 1","level":1},{"type":"text","q":"Write the equation of the line with m = 1 and c = −4.","accept":["y=x-4","y=-4+x","y=1x-4","y=-4+1x"],"solution":"y = x − 4","level":1},{"type":"text","q":"Write the equation of the line on the grid.","accept":["y=2x-1","y=-1+2x"],"solution":"c = −1. From (0, −1): run 1, rise 2, so m = 2. y = 2x − 1.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":2,"c":-1}]}},{"type":"text","q":"Write the equation of the line on the grid.","accept":["y=-x+2","y=2-x","y=-1x+2","y=2-1x"],"solution":"c = 2. From (0, 2): run 1, rise −1, so m = −1. y = −x + 2.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-1,"c":2}]}},{"type":"mcq","q":"Which equation matches the line on the grid?","options":["y = 2x + 1","y = {1/2}x + 1","y = x + 2"],"answer":1,"solution":"c = 1. From (0, 1) go right 2, up 1. m = {1/2}. So y = {1/2}x + 1.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":0.5,"c":1}],"points":[{"x":0,"y":1},{"x":2,"y":2},{"x":4,"y":3}]}},{"type":"text","q":"Write the equation of the line through (1, 4) and (3, 10).","accept":["y=3x+1","y=1+3x"],"solution":"m = (10 − 4) ÷ (3 − 1) = 6 ÷ 2 = 3. 4 = 3 × 1 + c, so c = 1. y = 3x + 1.","hint":"Find m first. Then put one point into y = mx + c to find c.","level":3},{"type":"text","q":"Write the equation of the line through (2, 1) and (4, −3).","accept":["y=-2x+5","y=5-2x"],"solution":"m = (−3 − 1) ÷ (4 − 2) = −4 ÷ 2 = −2. 1 = −2 × 2 + c, so 1 = −4 + c and c = 5. y = −2x + 5.","level":3}],"exit":[{"type":"text","q":"Write the equation of the line with m = 5 and c = −2.","accept":["y=5x-2","y=-2+5x"],"solution":"y = 5x − 2"},{"type":"text","q":"Write the equation of the line on the grid.","accept":["y=-2x+3","y=3-2x"],"solution":"c = 3. From (0, 3): run 1, rise −2, so m = −2. y = −2x + 3.","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-2,"c":3}]}}],"teacherNote":"Watch for m and c swapped (y = 5x + 2 written as y = 2x + 5), for c read off the x-axis, and for lost minus signs. With two points, many stop after finding m. Fix: always finish with a check — put a point into the equation. Ask: “Does (2, 0) work in your equation? Show me.”"},{"day":25,"topic":"gradient","session":6,"syllabus":"3.2.2","title":"Parallel lines and real life","ican":"I can spot parallel lines from their gradients and use y = mx + c for taxi fares and phone plans.","checkpoint":false,"vocab":[{"word":"parallel","meaning":"lines that never meet; they have the same gradient"},{"word":"fixed charge","meaning":"the amount you pay at the start; this is c"},{"word":"rate","meaning":"how much for each km, week or GB; this is m"}],"warmup":{"skill":"Money: multiply, then add","items":[{"type":"num","q":"4 × TT$5 + TT$3 = ?","answer":23,"solution":"4 × 5 = 20. 20 + 3 = 23. TT$23.","unit":"TT$"},{"type":"num","q":"10 × 3 + 20 = ?","answer":50,"solution":"10 × 3 = 30. 30 + 20 = 50."},{"type":"num","q":"TT$12 × 6 = ?","answer":72,"solution":"12 × 6 = 72. TT$72.","unit":"TT$"},{"type":"num","q":"TT$8 + 2 × TT$7 = ?","answer":22,"solution":"Multiply first: 2 × 7 = 14. Then 8 + 14 = 22. TT$22.","unit":"TT$"},{"type":"text","q":"Yesterday: write the equation of the line with m = 4 and c = −3.","accept":["y=4x-3","y=-3+4x"],"solution":"y = 4x − 3"}]},"learn":[{"type":"p","text":"Look at the lines on a netball court, or the two rails of a track. They never meet. They are **parallel**. Parallel lines are equally steep."},{"type":"keybox","title":"Key idea: parallel lines","text":"Parallel lines have the **same gradient m**. y = 2x + 1 and y = 2x − 3 are parallel: both have m = 2. Only c is different."},{"type":"diagram","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":2,"c":1,"label":"y = 2x + 1"},{"m":2,"c":-3,"label":"y = 2x − 3"}]},"caption":"Same gradient (2), different y-intercepts. They never meet."},{"type":"example","title":"Example 1: Which is parallel?","problem":"Which line is parallel to y = 3x + 5? A: y = 5x + 3. B: y = 3x − 2. C: y = −3x + 5.","steps":["The gradient of y = 3x + 5 is 3.","A: m = 5. Not the same.","B: m = 3. The same!","C: m = −3. Not the same (the sign is different)."],"answer":"B: y = 3x − 2"},{"type":"keybox","title":"Key idea: real life","text":"Total cost = rate × amount + fixed charge. This is y = mx + c. m = the cost for each km (or week, or GB). c = the fixed charge you pay at the start."},{"type":"example","title":"Example 2: Taxi fare","problem":"A taxi charges TT$5 to start plus TT$2 per km. Write the equation. Find the fare for 8 km.","steps":["Rate: TT$2 per km, so m = 2.","Fixed charge: TT$5, so c = 5.","y = 2x + 5 (x = km, y = fare in TT$)","For 8 km: y = 2 × 8 + 5","y = 16 + 5 = 21"],"answer":"y = 2x + 5. 8 km costs TT$21."},{"type":"example","title":"Example 3: Read a real-life graph","problem":"Nadia rents a bicycle at the Savannah. The graph shows the cost (TT$, y) for x hours. Find the fixed charge and the cost per hour.","steps":["The line starts at 3 on the y-axis. Fixed charge c = TT$3.","From (0, 3) to (1, 5): run 1, rise 2.","m = 2. It costs TT$2 per hour.","Equation: y = 2x + 3"],"answer":"TT$3 to start, TT$2 per hour","diagram":{"kind":"grid","xmin":0,"xmax":8,"ymin":0,"ymax":10,"lines":[{"from":[0,3],"to":[3,9],"label":"cost (TT$)"}],"points":[{"x":0,"y":3},{"x":1,"y":5}],"rise":{"from":[0,3],"to":[1,5]}}}],"tryit":[{"type":"blanks","q":"Are y = 4x + 1 and y = 4x − 6 parallel?","template":"y = 4x + 1 has m = [[4]]. y = 4x − 6 has m = [[4]]. The gradients are the same, so the lines are [[parallel]].","solution":"Both have m = 4, so they are parallel.","hint":"Look only at the number in front of x."},{"type":"blanks","q":"A maxi-taxi fare: TT$6 fixed charge plus TT$3 per km.","template":"m = [[3]] and c = [[6]]. y = [[3]]x + [[6]]. For 5 km: y = 3 × 5 + 6 = [[21]].","solution":"y = 3x + 6. 5 km costs TT$21.","hint":"The per-km amount is m. The fixed charge is c."}],"practice":[{"type":"mcq","q":"Which line is parallel to y = 2x + 7?","options":["y = 7x + 2","y = 2x − 1","y = −2x + 7"],"answer":1,"solution":"Parallel means the same m. y = 2x − 1 has m = 2.","level":1},{"type":"text","q":"Write the equation of the line parallel to y = 5x + 1 that crosses the y-axis at (0, 3).","accept":["y=5x+3","y=3+5x"],"solution":"Parallel, so m = 5. Crosses at (0, 3), so c = 3. y = 5x + 3.","level":1},{"type":"text","q":"A maxi-taxi charges TT$4 plus TT$2 per km. Write the equation for the fare y (TT$) for x km.","accept":["y=2x+4","y=4+2x"],"solution":"Rate m = 2. Fixed charge c = 4. y = 2x + 4.","level":2},{"type":"num","q":"Use y = 2x + 4. What is the fare for 7 km?","answer":18,"solution":"y = 2 × 7 + 4 = 14 + 4 = 18. TT$18.","level":2,"unit":"TT$"},{"type":"num","q":"The graph shows the cost (TT$) to rent a beach chair at Maracas for x hours. What is the fixed charge?","answer":4,"solution":"The line starts at 4 on the y-axis. TT$4.","level":2,"diagram":{"kind":"grid","xmin":0,"xmax":8,"ymin":0,"ymax":10,"lines":[{"from":[0,4],"to":[3,10],"label":"cost (TT$)"}]},"unit":"TT$"},{"type":"num","q":"Same graph. How much does each extra hour cost?","answer":2,"solution":"From (0, 4) to (1, 6): rise 2, run 1. m = 2. TT$2 per hour.","level":2,"diagram":{"kind":"grid","xmin":0,"xmax":8,"ymin":0,"ymax":10,"lines":[{"from":[0,4],"to":[3,10],"label":"cost (TT$)"}],"rise":{"from":[0,4],"to":[1,6]}},"unit":"TT$"},{"type":"num","q":"A taxi fare is y = 3x + 5. Priya paid TT$29. How many km did she travel?","answer":8,"solution":"29 = 3x + 5. 3x = 29 − 5 = 24. x = 24 ÷ 3 = 8 km.","hint":"Put y = 29 and solve the equation.","level":3,"unit":"km"},{"type":"mcq","q":"Plan A: TT$20 fixed plus TT$5 per GB. Plan B: TT$10 per GB, no fixed charge. Which is cheaper for 3 GB?","options":["Plan A","Plan B","They cost the same"],"answer":1,"solution":"A: 5 × 3 + 20 = 35. B: 10 × 3 = 30. Plan B is cheaper.","level":3}],"exit":[{"type":"mcq","q":"Which line is parallel to y = −3x + 2?","options":["y = 3x + 2","y = −3x − 4","y = 2x − 3"],"answer":1,"solution":"Same gradient: m = −3."},{"type":"num","q":"A taxi charges TT$6 plus TT$4 per km: y = 4x + 6. Find the fare for 5 km.","answer":26,"solution":"y = 4 × 5 + 6 = 20 + 6 = 26. TT$26.","unit":"TT$"}],"teacherNote":"Students often think lines with the same c are parallel, or that y = 3x and y = −3x are parallel. In real-life problems they mix up the rate and the fixed charge. Fix: ask “What do you pay even for 0 km?” — that is c. “What do you pay for each extra km?” — that is m."},{"day":26,"topic":"gradient","session":6,"syllabus":"3.2.2","title":"Checkpoint: Gradient & Equation of a Line","ican":"I can find gradients, read m and c, write y = mx + c and use it for parallel lines and real life.","checkpoint":true,"vocab":[{"word":"gradient (m)","meaning":"{rise/run}: how steep a line is"},{"word":"y-intercept (c)","meaning":"where the line crosses the y-axis"},{"word":"parallel","meaning":"same gradient, never meet"}],"warmup":{"skill":"Mixed: negatives, division, substitution","items":[{"type":"num","q":"−10 ÷ 5 = ?","answer":-2,"solution":"10 ÷ 5 = 2. Negative ÷ positive = negative: −2."},{"type":"num","q":"3 − (−4) = ?","answer":7,"solution":"3 + 4 = 7."},{"type":"num","q":"y = 5x − 2. Find y when x = 0.","answer":-2,"solution":"5 × 0 − 2 = −2."},{"type":"num","q":"Yesterday: a taxi fare is y = 2x + 5. Find the fare (TT$) for 6 km.","answer":17,"solution":"2 × 6 + 5 = 12 + 5 = 17.","unit":"TT$"}]},"learn":[{"type":"keybox","title":"Remember: gradient from a grid","text":"m = {rise/run}. Go across first (run), then up (+) or down (−). Uphill = positive, downhill = negative, flat = 0."},{"type":"keybox","title":"Remember: gradient from two points","text":"m = (y₂ − y₁) ÷ (x₂ − x₁). y on top. Same order top and bottom. Use brackets for negatives."},{"type":"keybox","title":"Remember: y = mx + c","text":"m = gradient (number in front of x). c = y-intercept (number on its own); the line crosses the y-axis at (0, c). To write an equation: find m, find c, check with a point."},{"type":"keybox","title":"Remember: parallel and real life","text":"Parallel lines have the same m. In real life, c = fixed charge, m = rate (cost for each km, week or GB)."}],"tryit":[],"practice":[{"type":"num","q":"Find the gradient of the line. Count the squares.","answer":3,"solution":"Run = 2, rise = 6. m = 6 ÷ 2 = 3.","level":1,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":6,"lines":[{"m":3,"c":-1}],"rise":{"from":[0,-1],"to":[2,5]}}},{"type":"mcq","q":"Is the gradient of this line positive, negative or zero?","options":["Positive","Negative","Zero"],"answer":1,"solution":"It goes downhill from left to right: negative.","level":1,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":-1,"c":-1}]}},{"type":"num","q":"What is the y-intercept of y = 4x − 3?","answer":-3,"solution":"The number on its own is −3.","level":1},{"type":"text","q":"Write the equation of the line with m = −2 and c = 6.","accept":["y=-2x+6","y=6-2x"],"solution":"y = −2x + 6","level":1},{"type":"num","q":"Find the gradient of the line through (−1, 2) and (3, 10).","answer":2,"solution":"(10 − 2) ÷ (3 − (−1)) = 8 ÷ 4 = 2.","level":2},{"type":"num","q":"Find the gradient of the line through (0, 3) and (4, 1). (You may type a fraction, like 1/2, or a decimal.)","answer":-0.5,"solution":"(1 − 3) ÷ (4 − 0) = −2 ÷ 4 = −{1/2} = −0.5.","level":2,"tol":0.01},{"type":"mcq","q":"For y = 4 − 5x, what are m and c?","options":["m = 4, c = −5","m = −5, c = 4","m = 5, c = 4"],"answer":1,"solution":"Rewrite as y = −5x + 4. m = −5, c = 4.","level":2},{"type":"text","q":"Write the equation of the line on the grid.","accept":["y=x-3","y=-3+x","y=1x-3","y=-3+1x"],"solution":"c = −3. From (0, −3): run 1, rise 1, so m = 1. y = x − 3.","level":2,"diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":1,"c":-3}]}},{"type":"plot","q":"Plot the y-intercept of y = −3x + 2 and the y-intercept of y = x − 4.","grid":{"xmin":-5,"xmax":5,"ymin":-5,"ymax":5},"answer":[[0,2],[0,-4]],"solution":"c = 2 gives (0, 2). c = −4 gives (0, −4).","level":2},{"type":"mcq","q":"Which line is parallel to y = {1/2}x − 1?","options":["y = 2x − 1","y = {1/2}x + 4","y = −{1/2}x − 1"],"answer":1,"solution":"Same gradient {1/2}.","level":2},{"type":"text","q":"Write the equation of the line through (1, 1) and (3, 7).","accept":["y=3x-2","y=-2+3x"],"solution":"m = (7 − 1) ÷ (3 − 1) = 6 ÷ 2 = 3. 1 = 3 × 1 + c, so c = −2. y = 3x − 2.","level":3},{"type":"num","q":"A phone plan costs TT$30 to join plus TT$12 per week: y = 12x + 30. Kyle paid TT$90 in total. For how many weeks?","answer":5,"solution":"90 = 12x + 30. 12x = 60. x = 60 ÷ 12 = 5 weeks.","level":3,"unit":"weeks"}],"exit":[{"type":"num","q":"Find the gradient of the line through (2, 3) and (4, −1).","answer":-2,"solution":"(−1 − 3) ÷ (4 − 2) = −4 ÷ 2 = −2."},{"type":"text","q":"Write the equation of the line on the grid.","accept":["y=2x+1","y=1+2x"],"solution":"c = 1. From (0, 1): run 1, rise 2, so m = 2. y = 2x + 1.","diagram":{"kind":"grid","xmin":-5,"xmax":5,"ymin":-5,"ymax":5,"lines":[{"m":2,"c":1}]}},{"type":"mcq","q":"A taxi charges TT$7 to start plus TT$3 per km. Which equation gives the fare y for x km?","options":["y = 7x + 3","y = 3x + 7","y = 10x"],"answer":1,"solution":"Rate m = 3, fixed charge c = 7. y = 3x + 7."}],"teacherNote":"This checkpoint feeds straight into the mid-term (Graphs & Straight Lines). Sort errors: run ÷ rise or missing minus signs → Days 20–22; m and c swapped or sign of c lost → Days 23–24; confusing rate with fixed charge → Day 25. Ask each student to explain one exit item aloud to you."},{"day":27,"topic":"pythagoras","session":7,"syllabus":"3.4.3","title":"Squares, roots and right angles","ican":"I can square a number, find a square root, and name the hypotenuse of a right-angled triangle.","checkpoint":false,"vocab":[{"word":"square number","meaning":"a number times itself, like 5² = 5 × 5 = 25"},{"word":"square root (√)","meaning":"the number you square to get it: √25 = 5"},{"word":"right angle","meaning":"a square corner of 90°, shown by a small square"},{"word":"hypotenuse","meaning":"the longest side of a right-angled triangle, opposite the right angle"}],"warmup":{"skill":"Squares & square roots","items":[{"type":"num","q":"7² = ?  (7² means 7 × 7)","answer":49,"solution":"7 × 7 = 49"},{"type":"num","q":"9² = ?","answer":81,"solution":"9 × 9 = 81"},{"type":"num","q":"√64 = ?","answer":8,"hint":"Which number times itself makes 64?","solution":"8 × 8 = 64, so √64 = 8"},{"type":"num","q":"√100 = ?","answer":10,"solution":"10 × 10 = 100, so √100 = 10"},{"type":"num","q":"Recall: the line y = 3x + 2. What is the gradient?","answer":3,"hint":"The gradient is the number in front of x.","solution":"In y = mx + c, m is the gradient. Here m = 3."}]},"learn":[{"type":"p","text":"Draw a square with sides of 4 cm. Split it into 1 cm squares. Count them. There are 16. So 4 **squared** is 16. We write 4² = 16."},{"type":"keybox","title":"Key idea: squares and square roots","text":"To **square** a number, times it by itself: 5² = 5 × 5 = 25. The **square root** undoes squaring: √25 = 5."},{"type":"tip","text":"5² is **not** 5 × 2. The small 2 means \"times itself\". 5² = 5 × 5 = 25."},{"type":"table","headers":["n","n²","n","n²"],"rows":[["1","1","7","49"],["2","4","8","64"],["3","9","9","81"],["4","16","10","100"],["5","25","11","121"],["6","36","12","144"]]},{"type":"example","title":"Example 1: Square and square root","problem":"Work out 6² and √81.","steps":["6² means 6 × 6.","6 × 6 = 36.","So 6² = 36.","For √81, ask: what number times itself makes 81?","9 × 9 = 81.","So √81 = 9."],"answer":"6² = 36 and √81 = 9"},{"type":"keybox","title":"Key idea: the hypotenuse","text":"In a right-angled triangle, the longest side is the **hypotenuse**. It is always **opposite** the right angle. It does not touch the square corner."},{"type":"diagram","diagram":{"kind":"righttri","base":"4 cm","height":"3 cm","hyp":"5 cm (hypotenuse)"},"caption":"The hypotenuse is the sloping side, across from the right angle."},{"type":"example","title":"Example 2: Name the hypotenuse","problem":"Triangle PQR has a right angle at Q. Which side is the hypotenuse?","steps":["Find the small square. The right angle is at Q.","Look straight across the triangle from Q.","The side across from Q joins P and R.","So the hypotenuse is PR."],"answer":"PR","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.0,0.0],[0.0,3.0]],"vertexLabels":["Q","R","P"],"rightAngleAt":0}]}},{"type":"tip","text":"Look at the 3, 4, 5 triangle: 3² + 4² = 9 + 16 = 25. And 5² = 25 too! Tomorrow you will use this pattern."}],"tryit":[{"type":"blanks","q":"Square 8.","template":"8² = [[8]] × [[8]] = [[64]]","hint":"Squaring means times the number by itself.","solution":"8² = 8 × 8 = 64"},{"type":"blanks","q":"Find √49.","template":"Which number times itself makes 49? [[7]] × [[7]] = 49. So √49 = [[7]].","hint":"Use the table of squares above.","solution":"7 × 7 = 49, so √49 = 7"},{"type":"blanks","q":"Triangle XYZ has a right angle at Y.","template":"The right angle is at [[Y]]. The side opposite Y joins X and Z. So the hypotenuse is [[XZ|ZX]].","hint":"Find the small square. Then look across the triangle.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[0.0,3.0]],"vertexLabels":["Y","Z","X"],"rightAngleAt":0}]},"solution":"The side across from the right angle at Y is XZ."}],"practice":[{"type":"num","q":"11² = ?","answer":121,"solution":"11 × 11 = 121","level":1},{"type":"num","q":"√36 = ?","answer":6,"solution":"6 × 6 = 36, so √36 = 6","level":1},{"type":"mcq","q":"Which of these is a square number?","options":["20","25","30","40"],"answer":1,"solution":"25 = 5 × 5. The others are not a number times itself.","level":1},{"type":"mcq","q":"This right-angled triangle has sides 5 cm, 12 cm and 13 cm. Which side is the hypotenuse?","options":["5 cm","12 cm","13 cm"],"answer":2,"diagram":{"kind":"righttri","base":"12 cm","height":"5 cm","hyp":"13 cm"},"solution":"The hypotenuse is the longest side, opposite the right angle: 13 cm.","level":2},{"type":"text","q":"Triangle ABC has a right angle at C. Name the hypotenuse.","accept":["AB","BA"],"hint":"Which side does not touch C?","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.0,0.0],[4.0,3.0]],"vertexLabels":["A","C","B"],"rightAngleAt":1}]},"solution":"The side opposite the right angle at C is AB.","level":2},{"type":"num","q":"√144 = ?","answer":12,"solution":"12 × 12 = 144, so √144 = 12","level":2},{"type":"num","q":"A square floor tile has an area of 81 cm². How long is one side?","answer":9,"unit":"cm","hint":"Area of a square = side². So side = √area.","solution":"Side × side = 81. 9 × 9 = 81. So the side is 9 cm.","level":3},{"type":"blanks","q":"Check the 6, 8, 10 triangle.","template":"6² + 8² = [[36]] + [[64]] = [[100]]. And 10² = [[100]]. Are they the same? [[yes]]","hint":"Square each number first. Then add.","diagram":{"kind":"righttri","base":"8 cm","height":"6 cm","hyp":"10 cm"},"solution":"36 + 64 = 100 and 10² = 100. Yes, they are the same.","level":3}],"exit":[{"type":"num","q":"9² = ?","answer":81,"solution":"9 × 9 = 81"},{"type":"text","q":"Triangle LMN has a right angle at M. Name the hypotenuse.","accept":["LN","NL"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,3.0],[0.0,0.0],[5.0,0.0]],"vertexLabels":["L","M","N"],"rightAngleAt":1}]},"solution":"The side opposite the right angle at M is LN."}],"teacherNote":"Watch for 3² = 6 (multiplying by 2 instead of squaring) and for students who think the hypotenuse is the bottom side. Quick fix: ask 'What is 3² as a picture?' (a 3 by 3 square = 9 squares) and 'Put your finger on the right angle. Which side does not touch it?'"},{"day":28,"topic":"pythagoras","session":7,"syllabus":"3.4.3","title":"Finding the longest side","ican":"I can use Pythagoras' theorem to find the hypotenuse.","checkpoint":false,"vocab":[{"word":"Pythagoras' theorem","meaning":"in a right-angled triangle, c² = a² + b²"},{"word":"hypotenuse (c)","meaning":"the longest side, opposite the right angle"},{"word":"shorter sides (a and b)","meaning":"the two sides that make the right angle"}],"warmup":{"skill":"Squaring and adding","items":[{"type":"num","q":"3² + 4² = ?","answer":25,"hint":"Square each number first. Then add.","solution":"3² = 9 and 4² = 16. 9 + 16 = 25"},{"type":"num","q":"6² + 8² = ?","answer":100,"solution":"36 + 64 = 100"},{"type":"num","q":"5² + 12² = ?","answer":169,"solution":"25 + 144 = 169"},{"type":"num","q":"√169 = ?","answer":13,"solution":"13 × 13 = 169, so √169 = 13"},{"type":"mcq","q":"Recall: in a right-angled triangle, where is the hypotenuse?","options":["It is the shortest side","It is opposite the right angle","It touches the right angle"],"answer":1,"solution":"The hypotenuse is the longest side. It is opposite the right angle."}]},"learn":[{"type":"p","text":"Take a triangle with sides 3, 4 and 5. Draw a square on each side. The squares hold 9, 16 and 25 little squares. Look: 9 + 16 = 25. The two small squares fill the big square exactly!"},{"type":"diagram","diagram":{"kind":"righttri","base":"4 cm","height":"3 cm","hyp":"5 cm"},"caption":"3² + 4² = 9 + 16 = 25 = 5²"},{"type":"keybox","title":"Pythagoras' theorem","text":"In a right-angled triangle: **c² = a² + b²**. c is the hypotenuse. a and b are the two shorter sides."},{"type":"keybox","title":"Finding the hypotenuse: 3 steps","text":"1. **Square** the two shorter sides. 2. **Add** them. 3. **Square root** the answer."},{"type":"example","title":"Example 1: Find x","problem":"The shorter sides are 6 cm and 8 cm. Find the hypotenuse x.","steps":["x² = 6² + 8²","x² = 36 + 64","x² = 100","x = √100","x = 10 cm"],"answer":"x = 10 cm","diagram":{"kind":"righttri","base":"8 cm","height":"6 cm","hyp":"x"}},{"type":"example","title":"Example 2: Find y","problem":"The shorter sides are 5 cm and 12 cm. Find the hypotenuse y.","steps":["y² = 5² + 12²","y² = 25 + 144","y² = 169","y = √169","y = 13 cm"],"answer":"y = 13 cm","diagram":{"kind":"righttri","base":"12 cm","height":"5 cm","hyp":"y"}},{"type":"tip","text":"Check your answer. The hypotenuse must be the **longest** side. 13 is bigger than 5 and 12. Good!"}],"tryit":[{"type":"blanks","q":"Find x.","template":"x² = 3² + 4²   x² = [[9]] + [[16]]   x² = [[25]]   x = √25 = [[5]] cm","hint":"Square 3 and 4 first.","diagram":{"kind":"righttri","base":"4 cm","height":"3 cm","hyp":"x"},"solution":"x² = 9 + 16 = 25, so x = 5 cm"},{"type":"blanks","q":"Find x.","template":"x² = 8² + 15²   x² = [[64]] + [[225]]   x² = [[289]]   x = √289 = [[17]] cm","hint":"15² = 15 × 15 = 225. 17 × 17 = 289.","diagram":{"kind":"righttri","base":"15 cm","height":"8 cm","hyp":"x"},"solution":"x² = 64 + 225 = 289, so x = 17 cm"},{"type":"blanks","q":"Find x.","template":"x² = 7² + 24²   x² = [[49]] + [[576]]   x² = [[625]]   x = √625 = [[25]] cm","hint":"24 × 24 = 576. Try 25 × 25 for the root.","diagram":{"kind":"righttri","base":"24 cm","height":"7 cm","hyp":"x"},"solution":"x² = 49 + 576 = 625, so x = 25 cm"}],"practice":[{"type":"num","q":"Find the hypotenuse x.","answer":10,"unit":"cm","diagram":{"kind":"righttri","base":"6 cm","height":"8 cm","hyp":"x"},"solution":"x² = 6² + 8² = 36 + 64 = 100. x = √100 = 10 cm","level":1},{"type":"blanks","q":"Find c.","template":"c² = 9² + 12² = [[81]] + [[144]] = [[225]]. c = √225 = [[15]] cm","diagram":{"kind":"righttri","base":"12 cm","height":"9 cm","hyp":"c"},"solution":"81 + 144 = 225, and √225 = 15","level":1},{"type":"num","q":"Find the hypotenuse h.","answer":13,"unit":"cm","diagram":{"kind":"righttri","base":"5 cm","height":"12 cm","hyp":"h"},"solution":"h² = 12² + 5² = 144 + 25 = 169. h = √169 = 13 cm","level":1},{"type":"mcq","q":"You want the hypotenuse. What is your first step?","options":["Add the two sides","Square the two shorter sides","Take the square root"],"answer":1,"solution":"First square the two shorter sides. Then add. Then square root.","level":2},{"type":"num","q":"Find the hypotenuse x.","answer":20,"unit":"cm","diagram":{"kind":"righttri","base":"16 cm","height":"12 cm","hyp":"x"},"solution":"x² = 12² + 16² = 144 + 256 = 400. x = √400 = 20 cm","level":2},{"type":"num","q":"Find the hypotenuse x.","answer":50,"unit":"m","diagram":{"kind":"righttri","base":"40 m","height":"30 m","hyp":"x"},"solution":"x² = 30² + 40² = 900 + 1600 = 2500. x = √2500 = 50 m","level":2},{"type":"num","q":"Aaliyah's garden in Chaguanas is a rectangle 15 m long and 8 m wide. How long is the diagonal path across it?","answer":17,"unit":"m","hint":"The diagonal cuts the rectangle into two right-angled triangles.","diagram":{"kind":"righttri","base":"15 m","height":"8 m","hyp":"diagonal"},"solution":"d² = 15² + 8² = 225 + 64 = 289. d = √289 = 17 m","level":3},{"type":"mcq","q":"Ravi says: \"The shorter sides are 3 cm and 4 cm, so the hypotenuse is 3 + 4 = 7 cm.\" What did he do wrong?","options":["He added without squaring first","He should have subtracted","Nothing, 7 cm is right"],"answer":0,"solution":"Square first: 9 + 16 = 25. Then √25 = 5 cm, not 7 cm.","level":3}],"exit":[{"type":"num","q":"Find the hypotenuse x.","answer":15,"unit":"cm","diagram":{"kind":"righttri","base":"12 cm","height":"9 cm","hyp":"x"},"solution":"x² = 9² + 12² = 81 + 144 = 225. x = √225 = 15 cm"},{"type":"num","q":"Find the hypotenuse x.","answer":26,"unit":"cm","diagram":{"kind":"righttri","base":"24 cm","height":"10 cm","hyp":"x"},"solution":"x² = 10² + 24² = 100 + 576 = 676. x = √676 = 26 cm"}],"teacherNote":"Two common errors: adding the sides without squaring (3 + 4 = 7), and stopping at c² (giving 25 instead of 5). Insist on the three lines 'square, add, root'. Quick fix question: 'Is your answer longer than both shorter sides, but shorter than the two added together?'"},{"day":29,"topic":"pythagoras","session":7,"syllabus":"3.4.3","title":"Finding a shorter side","ican":"I can use Pythagoras' theorem to find a shorter side when I know the hypotenuse.","checkpoint":false,"vocab":[{"word":"shorter side","meaning":"one of the two sides that make the right angle"},{"word":"subtract","meaning":"take away: big − small"},{"word":"a² = c² − b²","meaning":"Pythagoras turned round to find a shorter side"}],"warmup":{"skill":"Squaring and subtracting","items":[{"type":"num","q":"13² − 12² = ?","answer":25,"hint":"Square each number first. Then take away.","solution":"169 − 144 = 25"},{"type":"num","q":"10² − 6² = ?","answer":64,"solution":"100 − 36 = 64"},{"type":"num","q":"√64 = ?","answer":8,"solution":"8 × 8 = 64"},{"type":"num","q":"17² = ?","answer":289,"solution":"17 × 17 = 289"},{"type":"num","q":"Recall: the shorter sides are 6 cm and 8 cm. Find the hypotenuse.","answer":10,"unit":"cm","diagram":{"kind":"righttri","base":"8 cm","height":"6 cm","hyp":"x"},"solution":"36 + 64 = 100. √100 = 10 cm"}]},"learn":[{"type":"p","text":"Yesterday you knew the two shorter sides. You added their squares. Today you know the **hypotenuse** and one shorter side. The big square is the two small squares together. So take one small square **away** from the big square."},{"type":"keybox","title":"Key idea: finding a shorter side","text":"**a² = c² − b²**. 1. Square both sides you know. 2. **Subtract**: big − small. 3. Square root."},{"type":"tip","text":"Ask first: \"Is the missing side the hypotenuse?\" Yes → add. No → subtract."},{"type":"example","title":"Example 1: Find x","problem":"The hypotenuse is 10 cm. One shorter side is 8 cm. Find x.","steps":["The missing side is not the hypotenuse. So subtract.","x² = 10² − 8²","x² = 100 − 64","x² = 36","x = √36","x = 6 cm"],"answer":"x = 6 cm","diagram":{"kind":"righttri","base":"8 cm","height":"x","hyp":"10 cm"}},{"type":"example","title":"Example 2: Find y","problem":"The hypotenuse is 13 cm. One shorter side is 5 cm. Find y.","steps":["The missing side is not the hypotenuse. So subtract.","y² = 13² − 5²","y² = 169 − 25","y² = 144","y = √144","y = 12 cm"],"answer":"y = 12 cm","diagram":{"kind":"righttri","base":"y","height":"5 cm","hyp":"13 cm"}},{"type":"tip","text":"Check: a shorter side must be **less** than the hypotenuse. 12 is less than 13. Good!"}],"tryit":[{"type":"blanks","q":"Find x.","template":"x² = 5² − 4²   x² = [[25]] − [[16]]   x² = [[9]]   x = √9 = [[3]] cm","hint":"Big square take away small square.","diagram":{"kind":"righttri","base":"4 cm","height":"x","hyp":"5 cm"},"solution":"25 − 16 = 9, so x = 3 cm"},{"type":"blanks","q":"Find x.","template":"x² = 17² − 8²   x² = [[289]] − [[64]]   x² = [[225]]   x = √225 = [[15]] cm","hint":"17² = 289. 8² = 64.","diagram":{"kind":"righttri","base":"x","height":"8 cm","hyp":"17 cm"},"solution":"289 − 64 = 225, so x = 15 cm"},{"type":"blanks","q":"Find x.","template":"Is x the hypotenuse? [[no]]. So I [[subtract|take away|minus]].   x² = 25² − 24² = [[625]] − [[576]] = [[49]]   x = √49 = [[7]] cm","hint":"The hypotenuse is opposite the right angle. Here it is 25 cm.","diagram":{"kind":"righttri","base":"24 cm","height":"x","hyp":"25 cm"},"solution":"x is a shorter side, so subtract: 625 − 576 = 49, x = 7 cm"}],"practice":[{"type":"num","q":"Find x.","answer":8,"unit":"cm","diagram":{"kind":"righttri","base":"6 cm","height":"x","hyp":"10 cm"},"solution":"x² = 10² − 6² = 100 − 36 = 64. x = √64 = 8 cm","level":1},{"type":"num","q":"Find x.","answer":5,"unit":"cm","diagram":{"kind":"righttri","base":"12 cm","height":"x","hyp":"13 cm"},"solution":"x² = 13² − 12² = 169 − 144 = 25. x = √25 = 5 cm","level":1},{"type":"mcq","q":"The hypotenuse is 15 cm. One shorter side is 9 cm. Which working finds the other side?","options":["x² = 15² + 9²","x² = 15² − 9²","x² = 9² − 15²"],"answer":1,"diagram":{"kind":"righttri","base":"9 cm","height":"x","hyp":"15 cm"},"solution":"Missing side is not the hypotenuse, so subtract big − small: 225 − 81 = 144, x = 12 cm.","level":1},{"type":"num","q":"Find x.","answer":9,"unit":"cm","diagram":{"kind":"righttri","base":"12 cm","height":"x","hyp":"15 cm"},"solution":"x² = 15² − 12² = 225 − 144 = 81. x = √81 = 9 cm","level":2},{"type":"num","q":"Find x.","answer":12,"unit":"cm","diagram":{"kind":"righttri","base":"x","height":"16 cm","hyp":"20 cm"},"solution":"x² = 20² − 16² = 400 − 256 = 144. x = √144 = 12 cm","level":2},{"type":"num","q":"Careful! Find x. (Is x the hypotenuse?)","answer":15,"unit":"cm","hint":"x is opposite the right angle here.","diagram":{"kind":"righttri","base":"12 cm","height":"9 cm","hyp":"x"},"solution":"x IS the hypotenuse, so add: x² = 9² + 12² = 81 + 144 = 225. x = 15 cm","level":2},{"type":"num","q":"A ladder 5 m long leans against a wall in Arima. The foot of the ladder is 3 m from the wall. How high up the wall does it reach?","answer":4,"unit":"m","hint":"The ladder is the hypotenuse.","diagram":{"kind":"righttri","base":"3 m","height":"h","hyp":"5 m (ladder)"},"solution":"h² = 5² − 3² = 25 − 9 = 16. h = √16 = 4 m","level":3},{"type":"num","q":"Nadia flies a kite at Queen's Park Savannah. The string is 26 m long. The kite is right above a point 10 m from Nadia. How high is the kite?","answer":24,"unit":"m","hint":"The string is the hypotenuse.","diagram":{"kind":"righttri","base":"10 m","height":"h","hyp":"26 m (string)"},"solution":"h² = 26² − 10² = 676 − 100 = 576. h = √576 = 24 m","level":3}],"exit":[{"type":"num","q":"Find x.","answer":6,"unit":"cm","diagram":{"kind":"righttri","base":"8 cm","height":"x","hyp":"10 cm"},"solution":"x² = 10² − 8² = 100 − 64 = 36. x = √36 = 6 cm"},{"type":"num","q":"Find x.","answer":24,"unit":"cm","diagram":{"kind":"righttri","base":"7 cm","height":"x","hyp":"25 cm"},"solution":"x² = 25² − 7² = 625 − 49 = 576. x = √576 = 24 cm"}],"teacherNote":"Watch for students who add out of habit (getting a 'shorter' side longer than the hypotenuse), who subtract the wrong way (small − big gives a negative), and who subtract before squaring (13 − 5 = 8). Quick fix: 'Point to the hypotenuse. Is it the side you are finding?' and 'Is your answer shorter than the hypotenuse?'"},{"day":30,"topic":"pythagoras","session":7,"syllabus":"3.4.3","title":"Pythagoras in real life","ican":"I can use Pythagoras to solve real problems and check if a triangle is right-angled.","checkpoint":false,"vocab":[{"word":"diagonal","meaning":"a straight line from one corner of a shape to the opposite corner"},{"word":"1 decimal place (1 d.p.)","meaning":"one digit after the point, like 5.7"},{"word":"distance between two points","meaning":"the straight-line length from one point to the other"}],"warmup":{"skill":"Rounding to 1 decimal place","items":[{"type":"num","q":"Round 4.67 to 1 d.p.","answer":4.7,"hint":"Look at the digit after the one you keep. 5 or more → round up.","solution":"Look at the 2nd digit after the point: 7. It is 5 or more, so round up: 4.7"},{"type":"num","q":"Round 7.23 to 1 d.p.","answer":7.2,"solution":"The next digit is 3. Less than 5, so keep 7.2"},{"type":"num","q":"Round 5.66 to 1 d.p.","answer":5.7,"solution":"The next digit is 6. Round up: 5.7"},{"type":"num","q":"Use a calculator: √50 = 7.071… Round it to 1 d.p.","answer":7.1,"tol":0.05,"solution":"7.071…: the next digit is 7, so round up to 7.1"},{"type":"num","q":"Recall: the hypotenuse is 13 cm and one shorter side is 5 cm. Find the other side.","answer":12,"unit":"cm","diagram":{"kind":"righttri","base":"x","height":"5 cm","hyp":"13 cm"},"solution":"169 − 25 = 144. √144 = 12 cm"}]},"learn":[{"type":"p","text":"Marcus leans a ladder on his house in Arima. The wall stands straight up from the flat ground. That makes a **right angle**. The ladder is the **hypotenuse**. So Pythagoras can tell us how high the ladder reaches."},{"type":"keybox","title":"Key idea: real-life Pythagoras","text":"1. Draw the right-angled triangle. 2. Mark the hypotenuse (the ladder, the ramp, the diagonal). 3. Missing hypotenuse → **add**. Missing shorter side → **subtract**. 4. If the root is not exact, round to 1 d.p."},{"type":"example","title":"Example 1: A ladder","problem":"A 6 m ladder leans on a wall. Its foot is 2 m from the wall. How high up the wall does it reach? Give your answer to 1 d.p.","steps":["The ladder is the hypotenuse. We want a shorter side, so subtract.","h² = 6² − 2²","h² = 36 − 4","h² = 32","h = √32 = 5.656…","h = 5.7 m (1 d.p.)"],"answer":"5.7 m","diagram":{"kind":"righttri","base":"2 m","height":"h","hyp":"6 m (ladder)"}},{"type":"example","title":"Example 2: Distance between two points","problem":"Find the distance from A(1, 1) to B(4, 5).","steps":["Draw a right-angled triangle under AB.","Across: 4 − 1 = 3","Up: 5 − 1 = 4","AB² = 3² + 4²","AB² = 9 + 16 = 25","AB = √25 = 5 units"],"answer":"5 units","diagram":{"kind":"grid","xmin":0,"xmax":5,"ymin":0,"ymax":6,"points":[{"x":1,"y":1,"label":"A"},{"x":4,"y":5,"label":"B"}],"lines":[{"from":[1,1],"to":[4,5]}],"rise":{"from":[1,1],"to":[4,5]}}},{"type":"keybox","title":"Key idea: is it right-angled?","text":"Square the two shorter sides and add. Square the longest side. **Same answer → right-angled.** Different → not right-angled."},{"type":"example","title":"Example 3: Is it right-angled?","problem":"A triangle has sides 6 cm, 8 cm and 11 cm. Is it right-angled?","steps":["The longest side is 11 cm.","6² + 8² = 36 + 64 = 100","11² = 121","100 is not the same as 121.","So it is **not** right-angled."],"answer":"No"}],"tryit":[{"type":"blanks","q":"A ramp at school goes up 1 m over a flat distance of 4 m. How long is the ramp?","template":"x² = 1² + 4² = [[1]] + [[16]] = [[17]]   x = √17 = 4.123…   x = [[4.1]] m (1 d.p.)","hint":"The ramp is the hypotenuse, so add. Round: the next digit is 2, so keep 4.1.","diagram":{"kind":"righttri","base":"4 m","height":"1 m","hyp":"ramp"},"solution":"x² = 17, x = 4.123… ≈ 4.1 m"},{"type":"blanks","q":"Find the distance from A(2, 1) to B(8, 9).","template":"Across: 8 − 2 = [[6]]   Up: 9 − 1 = [[8]]   AB² = 36 + 64 = [[100]]   AB = [[10]] units","hint":"Count the squares across, then up.","diagram":{"kind":"grid","xmin":0,"xmax":9,"ymin":0,"ymax":10,"points":[{"x":2,"y":1,"label":"A"},{"x":8,"y":9,"label":"B"}],"lines":[{"from":[2,1],"to":[8,9]}],"rise":{"from":[2,1],"to":[8,9]}},"solution":"Across 6, up 8. 36 + 64 = 100. AB = 10 units"},{"type":"blanks","q":"Is a triangle with sides 5 cm, 12 cm and 13 cm right-angled?","template":"5² + 12² = [[25]] + [[144]] = [[169]]   13² = [[169]]   Right-angled? [[yes]]","hint":"The longest side is 13 cm.","solution":"25 + 144 = 169 and 13² = 169. Same, so yes."}],"practice":[{"type":"num","q":"A cricket field in Couva is a rectangle 40 m by 30 m. How long is the diagonal?","answer":50,"unit":"m","diagram":{"kind":"righttri","base":"40 m","height":"30 m","hyp":"d"},"solution":"d² = 40² + 30² = 1600 + 900 = 2500. d = √2500 = 50 m","level":1},{"type":"num","q":"A 10 m ladder leans on a wall. Its foot is 6 m from the wall. How high up the wall does it reach?","answer":8,"unit":"m","diagram":{"kind":"righttri","base":"6 m","height":"h","hyp":"10 m (ladder)"},"solution":"h² = 10² − 6² = 100 − 36 = 64. h = √64 = 8 m","level":1},{"type":"num","q":"A rectangle is 5 cm by 3 cm. Find the diagonal to 1 d.p.","answer":5.8,"tol":0.05,"unit":"cm","diagram":{"kind":"righttri","base":"5 cm","height":"3 cm","hyp":"d"},"solution":"d² = 5² + 3² = 25 + 9 = 34. d = √34 = 5.830… ≈ 5.8 cm","level":2},{"type":"num","q":"Find the distance from A(1, 2) to B(4, 6).","answer":5,"unit":"units","hint":"Count across, then up.","diagram":{"kind":"grid","xmin":0,"xmax":5,"ymin":0,"ymax":7,"points":[{"x":1,"y":2,"label":"A"},{"x":4,"y":6,"label":"B"}],"lines":[{"from":[1,2],"to":[4,6]}],"rise":{"from":[1,2],"to":[4,6]}},"solution":"Across 3, up 4. AB² = 9 + 16 = 25. AB = 5 units","level":2},{"type":"mcq","q":"A triangle has sides 6 cm, 7 cm and 9 cm. Is it right-angled?","options":["Yes","No"],"answer":1,"solution":"6² + 7² = 36 + 49 = 85. 9² = 81. 85 is not 81, so no.","level":2},{"type":"num","q":"A wheelchair ramp is 6 m long. It covers 5 m along the ground. How high does it rise? Give your answer to 1 d.p.","answer":3.3,"tol":0.05,"unit":"m","diagram":{"kind":"righttri","base":"5 m","height":"h","hyp":"6 m (ramp)"},"solution":"h² = 6² − 5² = 36 − 25 = 11. h = √11 = 3.316… ≈ 3.3 m","level":2},{"type":"num","q":"A flagpole at school is 8 m tall. A rope goes from the top to a peg 3 m from the bottom of the pole. How long is the rope? Give your answer to 1 d.p.","answer":8.5,"tol":0.05,"unit":"m","diagram":{"kind":"righttri","base":"3 m","height":"8 m","hyp":"rope"},"solution":"r² = 8² + 3² = 64 + 9 = 73. r = √73 = 8.544… ≈ 8.5 m","level":3},{"type":"num","q":"Find the distance from P(−2, 1) to Q(4, 9).","answer":10,"unit":"units","hint":"From −2 to 4 is 6 steps.","diagram":{"kind":"grid","xmin":-3,"xmax":5,"ymin":0,"ymax":10,"points":[{"x":-2,"y":1,"label":"P"},{"x":4,"y":9,"label":"Q"}],"lines":[{"from":[-2,1],"to":[4,9]}],"rise":{"from":[-2,1],"to":[4,9]}},"solution":"Across: 4 − (−2) = 6. Up: 9 − 1 = 8. PQ² = 36 + 64 = 100. PQ = 10 units","level":3}],"exit":[{"type":"num","q":"A 13 m ladder leans on a wall. Its foot is 5 m from the wall. How high does it reach?","answer":12,"unit":"m","diagram":{"kind":"righttri","base":"5 m","height":"h","hyp":"13 m (ladder)"},"solution":"h² = 13² − 5² = 169 − 25 = 144. h = 12 m"},{"type":"mcq","q":"A triangle has sides 8 cm, 15 cm and 17 cm. Is it right-angled?","options":["Yes","No"],"answer":0,"solution":"8² + 15² = 64 + 225 = 289. 17² = 289. Same, so yes."}],"teacherNote":"Students often cannot see the triangle in a word problem. Make them sketch it and label the hypotenuse before any working. For coordinates, watch for 4 − (−2) = 2. For rounding, watch for students writing all the calculator digits. Quick fix: 'Which side is the ladder? Is that the one you are finding?'"},{"day":31,"topic":"pythagoras","session":7,"syllabus":"3.4.3","title":"Checkpoint: Pythagoras","ican":"I can find any side of a right-angled triangle and use Pythagoras in real problems.","checkpoint":true,"vocab":[{"word":"hypotenuse","meaning":"longest side, opposite the right angle"},{"word":"Pythagoras' theorem","meaning":"c² = a² + b²"},{"word":"right-angled","meaning":"has a 90° corner; check with a² + b² = c²"}],"warmup":{"skill":"Mixed","items":[{"type":"num","q":"12² = ?","answer":144,"solution":"12 × 12 = 144"},{"type":"num","q":"√225 = ?","answer":15,"solution":"15 × 15 = 225"},{"type":"num","q":"8² + 6² = ?","answer":100,"solution":"64 + 36 = 100"},{"type":"num","q":"Round 9.36 to 1 d.p.","answer":9.4,"solution":"The next digit is 6, so round up: 9.4"},{"type":"mcq","q":"Recall: sides 7 cm, 24 cm, 25 cm. Is the triangle right-angled?","options":["Yes","No"],"answer":0,"solution":"7² + 24² = 49 + 576 = 625 = 25². Yes."}]},"learn":[{"type":"keybox","title":"Remember: squares, roots and the hypotenuse","text":"5² = 5 × 5 = 25 and √25 = 5. The **hypotenuse** is the longest side. It is opposite the right angle."},{"type":"keybox","title":"Remember: finding the hypotenuse","text":"Square, **add**, square root. c² = a² + b²."},{"type":"keybox","title":"Remember: finding a shorter side","text":"Square, **subtract** (big − small), square root. a² = c² − b²."},{"type":"keybox","title":"Remember: real life and checking","text":"Draw the triangle. Mark the hypotenuse. Round to 1 d.p. if needed. Right-angled only if a² + b² = c² exactly."}],"tryit":[],"practice":[{"type":"num","q":"√121 = ?","answer":11,"solution":"11 × 11 = 121","level":1},{"type":"text","q":"Triangle RST has a right angle at S. Name the hypotenuse.","accept":["RT","TR"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[6.0,0.0],[6.0,4.0]],"vertexLabels":["R","S","T"],"rightAngleAt":1}]},"solution":"The side opposite S is RT.","level":1},{"type":"num","q":"Find the hypotenuse x.","answer":10,"unit":"cm","diagram":{"kind":"righttri","base":"8 cm","height":"6 cm","hyp":"x"},"solution":"x² = 8² + 6² = 64 + 36 = 100. x = 10 cm","level":1},{"type":"num","q":"Find x.","answer":8,"unit":"cm","diagram":{"kind":"righttri","base":"15 cm","height":"x","hyp":"17 cm"},"solution":"x² = 17² − 15² = 289 − 225 = 64. x = 8 cm","level":1},{"type":"num","q":"Find the hypotenuse x.","answer":25,"unit":"cm","diagram":{"kind":"righttri","base":"20 cm","height":"15 cm","hyp":"x"},"solution":"x² = 15² + 20² = 225 + 400 = 625. x = 25 cm","level":2},{"type":"num","q":"Find x.","answer":10,"unit":"cm","diagram":{"kind":"righttri","base":"x","height":"24 cm","hyp":"26 cm"},"solution":"x² = 26² − 24² = 676 − 576 = 100. x = 10 cm","level":2},{"type":"num","q":"Find the hypotenuse to 1 d.p.","answer":8.1,"tol":0.05,"unit":"cm","diagram":{"kind":"righttri","base":"7 cm","height":"4 cm","hyp":"x"},"solution":"x² = 4² + 7² = 16 + 49 = 65. x = √65 = 8.062… ≈ 8.1 cm","level":2},{"type":"num","q":"Find x to 1 d.p.","answer":10.9,"tol":0.05,"unit":"cm","diagram":{"kind":"righttri","base":"x","height":"5 cm","hyp":"12 cm"},"solution":"x² = 12² − 5² = 144 − 25 = 119. x = √119 = 10.908… ≈ 10.9 cm","level":2},{"type":"mcq","q":"Which triangle is right-angled?","options":["5 cm, 6 cm, 8 cm","9 cm, 40 cm, 41 cm","4 cm, 5 cm, 7 cm"],"answer":1,"solution":"9² + 40² = 81 + 1600 = 1681 = 41². The others do not work (25 + 36 = 61 ≠ 64; 16 + 25 = 41 ≠ 49).","level":2},{"type":"num","q":"Find the distance from A(1, 1) to B(5, 4).","answer":5,"unit":"units","diagram":{"kind":"grid","xmin":0,"xmax":6,"ymin":0,"ymax":5,"points":[{"x":1,"y":1,"label":"A"},{"x":5,"y":4,"label":"B"}],"lines":[{"from":[1,1],"to":[5,4]}],"rise":{"from":[1,1],"to":[5,4]}},"solution":"Across 4, up 3. AB² = 16 + 9 = 25. AB = 5 units","level":3},{"type":"num","q":"Jaden's ladder is 5 m long. He wants it to reach 4 m up a wall in San Fernando. How far from the wall must the foot be?","answer":3,"unit":"m","diagram":{"kind":"righttri","base":"d","height":"4 m","hyp":"5 m (ladder)"},"solution":"d² = 5² − 4² = 25 − 16 = 9. d = 3 m","level":3},{"type":"num","q":"A triangular Carnival flag has two shorter sides of 2 m and 5 m meeting at a right angle. How long is the third side? Give your answer to 1 d.p.","answer":5.4,"tol":0.05,"unit":"m","diagram":{"kind":"righttri","base":"5 m","height":"2 m","hyp":"x"},"solution":"x² = 2² + 5² = 4 + 25 = 29. x = √29 = 5.385… ≈ 5.4 m","level":3}],"exit":[{"type":"num","q":"Find the hypotenuse x.","answer":5,"unit":"cm","diagram":{"kind":"righttri","base":"4 cm","height":"3 cm","hyp":"x"},"solution":"x² = 4² + 3² = 16 + 9 = 25. x = 5 cm"},{"type":"num","q":"Find x.","answer":12,"unit":"cm","diagram":{"kind":"righttri","base":"x","height":"5 cm","hyp":"13 cm"},"solution":"x² = 13² − 5² = 169 − 25 = 144. x = 12 cm"},{"type":"text","q":"Triangle DEF has a right angle at E. Name the hypotenuse.","accept":["DF","FD"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,4.0],[0.0,0.0],[3.0,0.0]],"vertexLabels":["D","E","F"],"rightAngleAt":1}]},"solution":"The side opposite E is DF."}],"teacherNote":"Checkpoint. Sort errors into three groups: (1) cannot square/root, send back to Day 27; (2) add/subtract mix-up, reteach 'Is the missing side the hypotenuse?' from Day 29; (3) cannot set up word problems, have them sketch and label first (Day 30). Formative Quiz 2 on the site covers this with triangles."},{"day":32,"topic":"similarity","session":8,"syllabus":"3.4.1","title":"Matching parts","ican":"I can find a missing angle in a triangle and match the corresponding sides and angles of two triangles.","checkpoint":false,"vocab":[{"word":"angle sum","meaning":"the three angles of a triangle add up to 180°"},{"word":"corresponding","meaning":"matching: in the same place on both shapes"},{"word":"vertex","meaning":"a corner of a shape (plural: vertices)"},{"word":"tick marks / arcs","meaning":"marks that show which sides or angles are equal"}],"warmup":{"skill":"Angles sum to 180°","items":[{"type":"mcq","q":"The three angles in any triangle add up to…","options":["90°","180°","360°"],"answer":1,"solution":"Angles in a triangle always add up to 180°."},{"type":"num","q":"Angles on a straight line add to 180°. One angle is 110°. Find the other.","answer":70,"unit":"°","solution":"180 − 110 = 70°"},{"type":"num","q":"A triangle has angles 50° and 60°. Find the third angle.","answer":70,"unit":"°","solution":"50 + 60 = 110. 180 − 110 = 70°"},{"type":"num","q":"A triangle has a right angle and a 35° angle. Find the third angle.","answer":55,"unit":"°","hint":"A right angle is 90°.","solution":"90 + 35 = 125. 180 − 125 = 55°"},{"type":"num","q":"Recall: the shorter sides of a right-angled triangle are 6 cm and 8 cm. Find the hypotenuse.","answer":10,"unit":"cm","diagram":{"kind":"righttri","base":"8 cm","height":"6 cm","hyp":"x"},"solution":"36 + 64 = 100. √100 = 10 cm"}]},"learn":[{"type":"p","text":"Tear the three corners off a paper triangle. Put them side by side. They always make a straight line. A straight line is 180°."},{"type":"keybox","title":"Key idea: angle sum","text":"The three angles in a triangle add up to **180°**. Missing angle = 180° − (the two angles you know)."},{"type":"example","title":"Example 1: Find the missing angle","problem":"A triangle has angles 65° and 45°. Find x.","steps":["Add the two angles you know.","65 + 45 = 110","Take this from 180.","180 − 110 = 70","x = 70°"],"answer":"x = 70°","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[1.59,3.41]],"vertexLabels":["A","B","C"],"angleLabels":["65°","45°","x"],"rightAngleAt":null}]}},{"type":"p","text":"Now put two copies of the same triangle side by side. One may be flipped or turned. Each side of one has a **matching** side on the other. We call them **corresponding** parts."},{"type":"keybox","title":"Key idea: corresponding parts","text":"Sides with the **same number of ticks** match. Angles with the **same number of arcs** match. The order of letters matches too: in ABC and PQR, A ↔ P, B ↔ Q, C ↔ R."},{"type":"example","title":"Example 2: Match the parts","problem":"Triangle ABC matches triangle PQR. Which side matches AB? Which angle matches angle C?","steps":["AB has 1 tick.","In PQR, the side with 1 tick is PQ.","So AB corresponds to PQ.","Angle C has 3 arcs.","In PQR, the angle with 3 arcs is R.","So angle C corresponds to angle R."],"answer":"AB ↔ PQ and ∠C ↔ ∠R","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.0,0.0],[1.0,3.0]],"vertexLabels":["A","B","C"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null},{"pts":[[10.0,0.0],[6.0,0.0],[9.0,3.0]],"vertexLabels":["P","Q","R"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null}]}},{"type":"tip","text":"A flipped triangle can trick your eyes. Trust the ticks, arcs and letter order, not the direction it faces."}],"tryit":[{"type":"blanks","q":"Find x.","template":"80 + 40 = [[120]]   180 − 120 = [[60]]   x = [[60]]°","hint":"Add the two angles you know. Take the total from 180.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[0.64,3.65]],"vertexLabels":["A","B","C"],"angleLabels":["80°","40°","x"],"rightAngleAt":null}]},"solution":"80 + 40 = 120. 180 − 120 = 60°"},{"type":"blanks","q":"Find x.","template":"90 + 35 = [[125]]   180 − 125 = [[55]]   x = [[55]]°","hint":"The small square means 90°.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[0.0,3.5]],"vertexLabels":["A","B","C"],"angleLabels":["","35°","x"],"rightAngleAt":0}]},"solution":"90 + 35 = 125. 180 − 125 = 55°"},{"type":"blanks","q":"Triangle DEF matches triangle XYZ.","template":"DE has 1 tick, so DE matches [[XY|YX]].   Angle E has 2 arcs, so angle E matches angle [[Y]].","hint":"Look for the same number of ticks or arcs.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[2.12,2.78]],"vertexLabels":["D","E","F"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null},{"pts":[[12.0,2.78],[7.0,2.78],[9.87,0.0]],"vertexLabels":["X","Y","Z"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null}]},"solution":"DE ↔ XY (1 tick). ∠E ↔ ∠Y (2 arcs)."}],"practice":[{"type":"num","q":"Find x.","answer":60,"unit":"°","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[1.51,4.16]],"vertexLabels":["A","B","C"],"angleLabels":["70°","50°","x"],"rightAngleAt":null}]},"solution":"70 + 50 = 120. 180 − 120 = 60°","level":1},{"type":"num","q":"Find x.","answer":48,"unit":"°","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[0.0,4.5]],"vertexLabels":["P","Q","R"],"angleLabels":["","42°","x"],"rightAngleAt":0}]},"solution":"90 + 42 = 132. 180 − 132 = 48°","level":1},{"type":"num","q":"All three angles of an equilateral triangle are equal. How big is each one?","answer":60,"unit":"°","solution":"180 ÷ 3 = 60°","level":1},{"type":"text","q":"Triangle ABC matches triangle PQR. Which side in PQR matches BC?","accept":["QR","RQ"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.0,0.0],[1.0,3.0]],"vertexLabels":["A","B","C"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null},{"pts":[[10.0,0.0],[6.0,0.0],[9.0,3.0]],"vertexLabels":["P","Q","R"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null}]},"solution":"BC has 2 ticks. The side in PQR with 2 ticks is QR.","level":2},{"type":"text","q":"Triangle ABC matches triangle PQR. Which angle in PQR matches angle A?","accept":["P","angle P","∠P","angleP"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.0,0.0],[1.0,3.0]],"vertexLabels":["A","B","C"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null},{"pts":[[10.0,0.0],[6.0,0.0],[9.0,3.0]],"vertexLabels":["P","Q","R"],"ticks":[1,2,3],"arcs":[1,2,3],"rightAngleAt":null}]},"solution":"Angle A has 1 arc. Angle P has 1 arc.","level":2},{"type":"text","q":"Triangle KLM matches triangle STU (same letter order). Which side matches KM?","accept":["SU","US"],"hint":"Use the letter order: K↔S, L↔T, M↔U.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.5,0.0],[3.03,2.61]],"vertexLabels":["K","L","M"],"ticks":[1,2,3],"rightAngleAt":null},{"pts":[[10.73,1.54],[6.5,0.0],[6.99,2.96]],"vertexLabels":["S","T","U"],"ticks":[1,2,3],"rightAngleAt":null}]},"solution":"K ↔ S and M ↔ U, so KM ↔ SU.","level":2},{"type":"num","q":"An isosceles triangle has a top angle of 40°. The two base angles are equal. Find one base angle.","answer":70,"unit":"°","hint":"Take away 40 from 180. Then share what is left equally.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.0,0.0],[2.0,5.49]],"vertexLabels":["A","B","C"],"arcs":[1,1,0],"angleLabels":["x","x","40°"],"rightAngleAt":null}]},"solution":"180 − 40 = 140. 140 ÷ 2 = 70°","level":3},{"type":"num","q":"Triangle ABC matches triangle PQR (same letter order). Angle A = 50° and angle B = 60°. How big is angle R?","answer":70,"unit":"°","hint":"First find angle C. Which angle in PQR matches C?","solution":"Angle C = 180 − 50 − 60 = 70°. R matches C, so angle R = 70°.","level":3}],"exit":[{"type":"num","q":"A triangle has angles 55° and 75°. Find the third angle.","answer":50,"unit":"°","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[3.62,5.16]],"vertexLabels":["A","B","C"],"angleLabels":["55°","75°","x"],"rightAngleAt":null}]},"solution":"55 + 75 = 130. 180 − 130 = 50°"},{"type":"text","q":"Triangle KLM matches triangle STU (same letter order). Which side matches LM?","accept":["TU","UT"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[4.5,0.0],[3.03,2.61]],"vertexLabels":["K","L","M"],"ticks":[1,2,3],"rightAngleAt":null},{"pts":[[10.73,1.54],[6.5,0.0],[6.99,2.96]],"vertexLabels":["S","T","U"],"ticks":[1,2,3],"rightAngleAt":null}]},"solution":"L ↔ T and M ↔ U, so LM ↔ TU."}],"teacherNote":"Students often match sides by position on the page instead of by ticks or letters, especially when one triangle is flipped. Also watch for 180 − 65 − 45 done as 180 − 65 + 45. Quick fix: 'Count the ticks on AB. Now find that many ticks on the other triangle.'"},{"day":33,"topic":"similarity","session":8,"syllabus":"3.4.1","title":"Congruent: SSS and SAS","ican":"I can show two triangles are congruent using SSS or SAS.","checkpoint":false,"vocab":[{"word":"congruent (≅)","meaning":"exactly the same shape and the same size"},{"word":"SSS","meaning":"side, side, side: all three sides match"},{"word":"SAS","meaning":"side, angle, side: two sides and the angle between them match"},{"word":"included angle","meaning":"the angle between two sides, where they meet"}],"warmup":{"skill":"Angle facts","items":[{"type":"num","q":"A triangle has angles 45° and 85°. Find the third angle.","answer":50,"unit":"°","solution":"45 + 85 = 130. 180 − 130 = 50°"},{"type":"num","q":"Angles on a straight line: one angle is 125°. Find the other.","answer":55,"unit":"°","solution":"180 − 125 = 55°"},{"type":"num","q":"Two straight lines cross. One angle is 60°. What is the vertically opposite angle?","answer":60,"unit":"°","hint":"The angle straight across from it is the same size.","solution":"Vertically opposite angles are equal: 60°"},{"type":"num","q":"Angles around a point add to 360°. Two angles are 150° and 120°. Find the third.","answer":90,"unit":"°","solution":"150 + 120 = 270. 360 − 270 = 90°"},{"type":"text","q":"Recall: triangle ABC matches triangle PQR (same letter order). Which angle matches angle B?","accept":["Q","angle Q","∠Q","angleQ"],"solution":"B is 2nd in ABC. Q is 2nd in PQR."}]},"learn":[{"type":"p","text":"Two keys cut from the same pattern open the same lock. They are the same shape and the same size. In maths we say they are **congruent**. You can turn or flip one, and it still fits exactly on the other."},{"type":"keybox","title":"Key idea: congruent triangles","text":"Congruent triangles have **all sides equal** and **all angles equal**. We write ΔABC ≅ ΔDEF. You do not need to check all six parts. A **test** of three parts is enough."},{"type":"keybox","title":"Test 1: SSS","text":"If all **three sides** of one triangle equal the three sides of the other, they are congruent. SSS = Side, Side, Side."},{"type":"example","title":"Example 1: SSS","problem":"Are these triangles congruent? Give the test.","steps":["Triangle ABC has sides 8 cm, 5 cm, 7 cm.","Triangle DEF has sides 8 cm, 5 cm, 7 cm.","All three sides match.","So they are congruent by SSS."],"answer":"Congruent (SSS)","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[8.0,0.0],[5.5,4.33]],"vertexLabels":["A","B","C"],"sideLabels":["8 cm","5 cm","7 cm"],"rightAngleAt":null},{"pts":[[17.73,2.07],[10.0,0.0],[11.29,4.83]],"vertexLabels":["D","E","F"],"sideLabels":["8 cm","5 cm","7 cm"],"rightAngleAt":null}]}},{"type":"keybox","title":"Test 2: SAS","text":"If **two sides** and the angle **between** them match, the triangles are congruent. SAS = Side, Angle, Side. The angle must be where the two sides meet."},{"type":"example","title":"Example 2: SAS","problem":"Are these triangles congruent? Give the test.","steps":["Both have a 6 cm side and a 4 cm side.","Both have a 50° angle.","The 50° angle is between the 6 cm and the 4 cm sides.","Side, angle, side match.","So they are congruent by SAS."],"answer":"Congruent (SAS)","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[6.0,0.0],[2.57,3.06]],"vertexLabels":["A","B","C"],"sideLabels":["6 cm","","4 cm"],"arcs":[1,0,0],"angleLabels":["50°","",""],"rightAngleAt":null},{"pts":[[14.0,3.06],[8.0,3.06],[11.43,0.0]],"vertexLabels":["P","Q","R"],"sideLabels":["6 cm","","4 cm"],"arcs":[1,0,0],"angleLabels":["50°","",""],"rightAngleAt":null}]}},{"type":"tip","text":"In SAS the A is in the middle. That reminds you: the angle sits **between** the two sides."}],"tryit":[{"type":"blanks","q":"Look at the sides of both triangles.","template":"Triangle 1: 6 cm, 4 cm, 3 cm. Triangle 2: 6 cm, 4 cm, 3 cm. Do all three sides match? [[yes]]   Test: [[SSS]]","hint":"Side, side, side.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[6.0,0.0],[2.42,1.78]],"vertexLabels":["A","B","C"],"sideLabels":["6 cm","4 cm","3 cm"],"rightAngleAt":null},{"pts":[[14.0,0.0],[8.0,0.0],[11.58,1.78]],"vertexLabels":["X","Y","Z"],"sideLabels":["6 cm","4 cm","3 cm"],"rightAngleAt":null}]},"solution":"All three sides match, so SSS."},{"type":"blanks","q":"Two sides and an angle match.","template":"The 7 cm and 5 cm sides match. The 40° angle is [[between]] them. Test: [[SAS]]","hint":"Does the 40° angle sit where the two sides meet?","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[7.0,0.0],[3.83,3.21]],"vertexLabels":["A","B","C"],"sideLabels":["7 cm","","5 cm"],"arcs":[1,0,0],"angleLabels":["40°","",""],"rightAngleAt":null},{"pts":[[15.89,0.0],[9.0,1.22],[12.68,3.83]],"vertexLabels":["D","E","F"],"sideLabels":["7 cm","","5 cm"],"arcs":[1,0,0],"angleLabels":["40°","",""],"rightAngleAt":null}]},"solution":"The angle is between the two sides, so SAS."},{"type":"blanks","q":"Compare the sides.","template":"Triangle ABC: 6, 5, 4. Triangle PQR: 7, 5, 4. Do all three sides match? [[no]]   Congruent? [[no]]","hint":"Check every side.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[6.0,0.0],[2.25,3.31]],"vertexLabels":["A","B","C"],"sideLabels":["6 cm","5 cm","4 cm"],"rightAngleAt":null},{"pts":[[8.0,0],[15.0,0],[10.86,2.8]],"vertexLabels":["P","Q","R"],"sideLabels":["7 cm","5 cm","4 cm"],"rightAngleAt":null}]},"solution":"6 cm is not 7 cm, so they are not congruent."}],"practice":[{"type":"mcq","q":"Congruent means…","options":["same shape and same size","same shape, different size","same area only"],"answer":0,"solution":"Congruent shapes fit exactly on top of each other.","level":1},{"type":"text","q":"Which test shows these triangles are congruent? (SSS or SAS)","accept":["SSS"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[2.1,2.14]],"vertexLabels":["A","B","C"],"ticks":[1,2,3],"rightAngleAt":null},{"pts":[[11.7,2.73],[7.0,1.02],[10.45,0.0]],"vertexLabels":["P","Q","R"],"ticks":[1,2,3],"rightAngleAt":null}]},"solution":"The ticks show all three sides match: SSS.","level":1},{"type":"text","q":"Which test shows these triangles are congruent? (SSS or SAS)","accept":["SAS"],"diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[1.2,3.29]],"vertexLabels":["K","L","M"],"ticks":[1,0,2],"arcs":[1,0,0],"rightAngleAt":null},{"pts":[[12.0,0.0],[7.0,0.0],[10.8,3.29]],"vertexLabels":["X","Y","Z"],"ticks":[1,0,2],"arcs":[1,0,0],"rightAngleAt":null}]},"solution":"Two sides match (ticks) and the angle between them matches (arc): SAS.","level":1},{"type":"mcq","q":"Triangle 1 has sides 5 cm, 6 cm, 9 cm. Triangle 2 has sides 9 cm, 5 cm, 6 cm. Are they congruent?","options":["Yes, by SSS","Yes, by SAS","No"],"answer":0,"solution":"The same three lengths, just in a different order. SSS.","level":2},{"type":"num","q":"ΔABC ≅ ΔDEF. Find x.","answer":7,"unit":"cm","hint":"Find the side with the same ticks.","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[7.0,0.0],[0.29,5.99]],"vertexLabels":["A","B","C"],"sideLabels":["7 cm","9 cm","6 cm"],"ticks":[1,2,3],"rightAngleAt":null},{"pts":[[15.89,1.22],[9.0,0.0],[14.57,7.07]],"vertexLabels":["D","E","F"],"sideLabels":["x","",""],"ticks":[1,2,3],"rightAngleAt":null}]},"solution":"DE matches AB (1 tick). AB = 7 cm, so x = 7 cm.","level":2},{"type":"num","q":"ΔABC ≅ ΔDEF. Find angle y.","answer":65,"unit":"°","diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[5.0,0.0],[2.0,4.29]],"vertexLabels":["A","B","C"],"ticks":[1,2,3],"arcs":[1,2,3],"angleLabels":["65°","55°",""],"rightAngleAt":null},{"pts":[[12.0,4.29],[7.0,4.29],[10.0,0.0]],"vertexLabels":["D","E","F"],"ticks":[1,2,3],"arcs":[1,2,3],"angleLabels":["y","",""],"rightAngleAt":null}]},"solution":"Angle D matches angle A (1 arc). Angle A = 65°, so y = 65°.","level":2},{"type":"mcq","q":"Both triangles have a 6 cm side, a 5 cm side and a 40° angle. Are they congruent?","options":["Yes, by SAS","No, the 40° angle is not between the two sides","Yes, by SSS"],"answer":1,"diagram":{"kind":"triangles","items":[{"pts":[[0.0,0.0],[6.0,0.0],[5.96,5.0]],"vertexLabels":["A","B","C"],"sideL
